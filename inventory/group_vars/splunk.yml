---
# Splunk Enterprise configuration group variables

# Service configuration
splunk_admin_user: admin
splunk_service_state: started
splunk_service_enabled: true

# Enable Java for Splunk DB Connect
splunk_docker_java_enabled: true

# Install MS SQL Server JDBC driver for DB Connect
splunk_docker_mssql_driver_enabled: true

# Data disk configuration
# The index volume is created and mounted by tofu-proxmox cloud-init, not by
# Ansible; nothing here consumed the previous device/mount variables. The role
# discovers the backing device from mount facts instead of assuming a device
# node, which matters because the VM's disk layout has drifted from its
# declaration. Reserved-block tuning is governed by
# splunk_docker_data_disk_reserved_percent in the role defaults.

# Managed service users. The AI agent gets its own identity so it can
# search/read the environment through the MCP server, with a bearer token
# minted per user.
#
# The token INHERITS THE USER'S ROLES, so whatever is listed here is what an
# agent's tool calls run as. This previously said `admin` with a note to narrow
# it "once the access pattern is known". The access pattern is known: the agent
# searches. It has never needed to administer anything.
#
# `user` is what that requires, and the platform's own defaults say so:
#
#   user   srchIndexesAllowed = *          searches every non-internal index
#   power  imports user, adds scheduling   no administrative capability either
#   admin  adds _* and the admin caps      creates users, installs apps, restarts
#
# So `admin` bought exactly two things over `user`: the internal indexes, and
# the ability to administer the platform the agent is supposed to be observing.
# Neither is part of its work, and the second is the one that matters — an
# identity that can edit users and roles can grant itself anything else.
#
# If a specific need for an internal index appears, add a custom role granting
# that index and nothing more. Do not reach back for `admin`; going through a
# named role keeps the reason for the grant written down.
# The role the identity actually needs: everything readable, nothing
# administrable.
#
# `admin` was wrong because it grants administration of the deployment the
# agent exists to observe, and an identity that can edit users and roles can
# grant itself anything else — which makes every other limit on it advisory.
#
# Plain `user` was ALSO wrong, and worse: it does not merely narrow the
# identity, it breaks it. Two reasons, both from the platform's own
# configuration rather than inference:
#
#   * Index scope. The platform's specification is explicit that "*" does not
#     match internal indexes, that internal indexes are "_*", and that the
#     wildcard matches all non-internal OR all internal, never both. So `user`
#     (allowed "*") silently loses every internal index.
#   * Tool execution. The MCP application grants the capability that gates
#     connecting and running tools to `admin` and `sc_admin` only. Under `user`
#     the agent could not execute a single tool.
#
# Hence a declared role: import `user` for the ordinary search grants, allow
# both index wildcards so nothing is out of reach, default searches to the same
# so a query that names no index is not silently confined, and add exactly the
# one capability tool execution needs.
#
# Deliberately NOT granted: the MCP administration capability, and every
# capability that edits users, roles or objects or restarts the service.
splunk_docker_manage_roles: true
splunk_docker_roles:
  - name: hermes_search
    imported_roles:
      - user
    srch_indexes_allowed:
      - "*"
      - "_*"
    srch_indexes_default:
      - "*"
      - "_*"
    capabilities:
      - mcp_tool_execute

splunk_docker_manage_users: true
splunk_docker_users:
  - name: hermes
    roles:
      - hermes_search

# Publish the shared Splunk MCP connection (SPLUNK_MCP_URL + minted
# SPLUNK_MCP_TOKEN) to OpenBao secret/ai/mcp/splunk. Requires a write-capable
# OpenBao AppRole token (BAO_ADDR/BAO_TOKEN) in the converge environment.
splunk_docker_token_publish_openbao: true

# Archive frozen buckets rather than deleting them.
#
# Splunk's default when a bucket ages out is deletion. That was inert here for
# an accidental reason — the per-index quotas were larger than the disk holding
# them, so nothing could ever bind and nothing ever froze. It stops being inert
# the moment a volume cap is set, and at that point "reclaim space" and "lose
# data" become the same action.
#
# So this is switched on FIRST and independently, well before any cap. Enabled
# with no caps set it changes nothing observable: nothing is freezing yet. That
# is the point — it is in place and proven before it is needed.
#
# The upload path was verified end to end against the real endpoint: a bucket
# archived, restored, and compared byte for byte. Restore procedure is in the
# runbooks under "Splunk frozen buckets".
splunk_docker_frozen_archive_enabled: true

# Volume ceilings, sized against the real filesystems on this host:
#   hot_warm -> 196G device, 188G available
#   cold     -> 442G device, 339G available
# Both sit well under available, because the preflight compares a cap to what
# is available now and a cap it cannot bind is refused.
#
# These are the step-3 caps the defaults describe, and their precondition is
# met: the frozen archive is confirmed working end to end on this host, so an
# eviction rolls a bucket to the archive rather than deleting it. Enabling them
# before that was proven would have made "reclaim space" mean "lose data".
#
# Neither cap binds at current usage (measured 2026-08-01: cold ~71G,
# hot_warm ~83G). That is intended - they are a ceiling on total growth,
# which nothing enforced before: only per-index quotas existed, and their sum
# could not bind the disk. This is the guard that makes the oldest data roll
# off regardless of any one index's own configuration.
#
# Retune these when the underlying storage changes, not when an index grows.
splunk_docker_volume_hot_warm_max_mb: 150000
splunk_docker_volume_cold_max_mb: 300000
