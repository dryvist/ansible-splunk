---
# Molecule preparation playbook
# Sets up the test container before running the splunk_docker role

- name: Prepare
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Wait for container to be ready
      ansible.builtin.wait_for_connection:
        timeout: 30

    - name: Gather facts
      ansible.builtin.setup:

    # No cache_valid_time here on purpose. The platform image is pulled fresh
    # from a moving :latest tag, and it bakes in an apt lists directory whose
    # timestamp can look recent while its contents no longer resolve. With a
    # validity window, Ansible treats that stale cache as good, skips the
    # refresh, and the very next task fails with "No package matching 'curl'".
    # A throwaway test container has nothing to gain from a warm cache, so
    # always refresh and let the install below be the thing that can fail.
    - name: Update apt cache (Debian/Ubuntu)
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Install base packages for Docker role
      ansible.builtin.apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - procps
          - systemd
          - iptables
          - python3-requests
        state: present
      when: ansible_os_family == 'Debian'

    # Nested overlayfs fails with EPERM on whiteouts, so molecule.yml mounts a
    # volume at /var/lib/docker (host filesystem), where overlay2 works. The
    # mirror serves the Docker Hub Splunk image the role pulls. Written before
    # Docker is installed so the daemon starts with it on first run.
    - name: Ensure /etc/docker directory exists
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        mode: '0755'

    - name: Configure Docker daemon storage driver and registry mirror
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        content: '{"storage-driver": "overlay2", "registry-mirrors": ["https://mirror.gcr.io"]}'
        mode: '0644'
