---
# Repo-specific data-contract checks for ansible-splunk.
#
# Lint + molecule are centralized in dryvist/.github/_ansible-ci.yml. The checks
# here are NOT generic ansible CI — they assert THIS repo's data contract
# (playbook syntax against a mock tofu inventory, input-template unit tests, and
# that the tofu inventory loads with the right group assignments). They stay
# local and are aggregated by the wrapper's "Merge Gate".

name: Data Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.9"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"

      - name: Cache Ansible collections
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ansible/collections
          key: ansible-collections-${{ hashFiles('requirements.yml') }}

      - name: Install dependencies
        run: |
          uv pip install --system ansible

      # `install` covers both sections. `collection install` skips `roles:` and
      # `role install` skips `collections:`, each silently and with a zero exit,
      # so a half-command leaves a dependency missing until something later
      # fails on it. This repo has a real `roles:` entry (splunk.splunk), so the
      # narrower form was already leaving it uninstalled here.
      - name: Install Ansible dependencies
        run: |
          ansible-galaxy install -r requirements.yml

      - name: Syntax check deploy.yml
        run: |
          ansible-playbook playbooks/deploy.yml --syntax-check

      - name: Syntax check configure_indexes.yml
        run: |
          ansible-playbook playbooks/configure_indexes.yml --syntax-check

      - name: Syntax check validate.yml
        run: |
          ansible-playbook playbooks/validate.yml --syntax-check

      - name: Syntax check site.yml
        run: |
          ansible-playbook playbooks/site.yml --syntax-check

      - name: Run template unit tests
        # Invoked via `bash` rather than `./` on purpose: that way the run does
        # not depend on the file's mode surviving in git, which a `git add` from
        # a working tree without the executable bit will silently drop.
        run: |
          uv pip install --system -r tests/templates/requirements.txt
          bash scripts/run-template-tests.sh

      - name: Verify Splunk MCP OpenBao publication contract
        run: |
          ansible-playbook tests/openbao_publish/verify.yml

      # Reads the selection expression out of the role and evaluates it, so a
      # drifted role fails here rather than passing against a stale copy.
      - name: Verify the undeclared auth-token gate
        run: |
          ansible-playbook tests/undeclared_tokens/verify.yml

  verify-inventory:
    name: Verify Inventory Load
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.x"

      # verify_inventory.yml imports inventory/load_tofu.yml, which include_role's
      # the shared inventory_resolve role by FQCN — so requirements.yml has to be
      # installed here, and this run is what proves the collection resolves it.
      # `install` covers both sections; `collection install` and `role install`
      # each silently ignore the other and still exit zero.
      - name: Install Ansible and dependencies
        run: |
          pip install ansible ansible-core netaddr
          ansible-galaxy collection install ansible.utils
          ansible-galaxy install -r requirements.yml

      - name: Verify tofu inventory loads correctly
        env:
          TOFU_INVENTORY_PATH: ${{ github.workspace }}/tests/inventory_load/tofu_inventory.json
          # load_tofu.yml's add_host marks this mandatory; the value is never
          # dialled in a -c local run.
          PROXMOX_SSH_KEY_PATH: /dev/null
        run: |
          ansible-playbook tests/inventory_load/verify_inventory.yml \
            -i inventory/hosts.yml \
            -c local

      - name: Verify example inventory has correct structure
        run: |
          python3 tests/inventory_load/check_example_structure.py
