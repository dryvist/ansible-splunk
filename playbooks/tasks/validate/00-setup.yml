---
- name: Load splunk_docker role defaults (namespaced, pre-role fallback)
  ansible.builtin.include_vars:
    dir: "{{ playbook_dir }}/../roles/splunk_docker/defaults/main"
    name: _splunk_docker_defaults

- name: Set fallback global defaults for nested templates
  ansible.builtin.set_fact:
    splunk_docker_data_dir: "{{ splunk_docker_data_dir | default(_splunk_docker_defaults.splunk_docker_data_dir) }}"
    splunk_docker_index_default_max_size_mb: >-
      {{ splunk_docker_index_default_max_size_mb | default(_splunk_docker_defaults.splunk_docker_index_default_max_size_mb) }}
    splunk_docker_index_default_frozen_time_secs: >-
      {{ splunk_docker_index_default_frozen_time_secs | default(_splunk_docker_defaults.splunk_docker_index_default_frozen_time_secs) }}

- name: Set derived fallback global defaults
  ansible.builtin.set_fact:
    splunk_docker_etc_dir: "{{ splunk_docker_etc_dir | default(_splunk_docker_defaults.splunk_docker_etc_dir) }}"

# Same source as the converge (playbooks/site.yml). A validation run reading
# only the environment would find an empty namespace under the unattended
# execution plane, silently fall through to the legacy-token-only branch below,
# and report the per-index tokens as absent — describing its own missing
# credential as a Splunk misconfiguration.
- name: Read the Splunk platform credentials from OpenBao
  ansible.builtin.set_fact:
    splunk_platform_secrets: >-
      {{ lookup('community.hashi_vault.vault_kv2_get',
                'platform/splunk/main').secret }}
  no_log: true

- name: Set HEC namespace and legacy token
  ansible.builtin.set_fact:
    splunk_docker_hec_namespace: "{{ splunk_platform_secrets.HEC_NAMESPACE }}"
    splunk_docker_hec_legacy_token: "{{ splunk_platform_secrets.SPLUNK_HEC_TOKEN }}"
  no_log: true

- name: Derive per-index HEC token values from namespace
  vars:
    index_names: >-
      {{ (splunk_docker_indexes | default((_splunk_docker_defaults.splunk_docker_indexes_core +
         _splunk_docker_defaults.splunk_docker_indexes_extra))) | map(attribute='name') | list }}
  ansible.builtin.set_fact:
    splunk_docker_hec_token_values: >-
      {{
        dict(index_names | zip(
          index_names | map('regex_replace', '^', 'splunk-hec-') | map('to_uuid', splunk_docker_hec_namespace)
        )) | combine({'legacy': splunk_docker_hec_legacy_token})
      }}
  when: splunk_docker_hec_namespace | length > 0
  no_log: true

- name: Fallback to SPLUNK_HEC_TOKEN if no namespace
  ansible.builtin.set_fact:
    splunk_docker_hec_token_values: >-
      {{ {'legacy': splunk_docker_hec_legacy_token} }}
  when: splunk_docker_hec_namespace | length == 0
  no_log: true
