---
- name: Check web.conf exists
  ansible.builtin.stat:
    path: "{{ (splunk_docker_managed_config_app_dir | default(_splunk_docker_defaults.splunk_docker_managed_config_app_dir)) }}/local/web.conf"
  register: web_conf

- name: Record web.conf status
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [{'check': 'web.conf configured', 'passed': web_conf.stat.exists}] }}"

- name: Check indexes.conf exists
  ansible.builtin.stat:
    path: "{{ (splunk_docker_managed_config_app_dir | default(_splunk_docker_defaults.splunk_docker_managed_config_app_dir)) }}/local/indexes.conf"
  register: indexes_conf

- name: Record indexes.conf status
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [{'check': 'indexes.conf configured', 'passed': indexes_conf.stat.exists}] }}"

- name: Check firewall.sh exists
  ansible.builtin.stat:
    path: "{{ (splunk_docker_config_dir | default(_splunk_docker_defaults.splunk_docker_config_dir)) }}/firewall.sh"
  register: firewall_script
  when: (splunk_docker_firewall_enabled | default(_splunk_docker_defaults.splunk_docker_firewall_enabled)) | default(false)

- name: Record firewall status
  ansible.builtin.set_fact:
    validation_results: "{{ validation_results + [{'check': 'Firewall configured', 'passed': firewall_script.stat.exists}] }}"
  when: (splunk_docker_firewall_enabled | default(_splunk_docker_defaults.splunk_docker_firewall_enabled)) | default(false)

- name: Load Splunk add-on registry
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/../roles/splunk_docker/vars/addons.yml"
  when: splunk_docker_addons is not defined

- name: Check Splunk add-ons are installed
  ansible.builtin.stat:
    path: "{{ (splunk_docker_etc_dir | default(_splunk_docker_defaults.splunk_docker_etc_dir)) }}/apps/{{ item.app_dir }}"
  loop: >-
    {{ (splunk_docker_addons | selectattr('install', 'undefined') | list)
       + (splunk_docker_addons | selectattr('install', 'defined')
          | selectattr('install', 'equalto', true) | list) }}
  loop_control:
    label: "{{ item.app_dir }}"
  register: splunk_docker_addon_checks

- name: Record add-on installation status
  ansible.builtin.set_fact:
    validation_results: >-
      {{ validation_results + [{
           'check': item.item.app_dir + ' app installed',
           'passed': item.stat.exists
         }] }}
  loop: "{{ splunk_docker_addon_checks.results }}"
  loop_control:
    label: "{{ item.item.app_dir }}"

- name: Set MCP Server app existence flag
  ansible.builtin.set_fact:
    splunk_docker_mcp_app_exists: >-
      {{ (splunk_docker_addon_checks.results
          | selectattr('item.role', 'defined')
          | selectattr('item.role', 'equalto', 'mcp_server')
          | list | first | default({'stat': {'exists': false}})).stat.exists | bool }}
