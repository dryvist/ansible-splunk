---
- name: Resolve latest release per Splunkbase entry
  ansible.builtin.uri:
    url: "{{ splunkbase_api }}/api/v1/app/{{ item.splunkbase_id }}/release/"
    method: GET
    return_content: true
    status_code: 200
    timeout: 30
  register: splunkbase_release_q
  loop: "{{ splunkbase_entries }}"
  loop_control:
    label: "app {{ item.splunkbase_id }}"
  changed_when: false
  failed_when: false

- name: Compute every resolved release's desired version
  ansible.builtin.set_fact:
    splunkbase_desired_all: >-
      {{ splunkbase_desired_all | default([]) + [item.0 | combine({
        'desired_version': (
          item.0.pin_version if item.0.pin_version is defined
          else (
            (item.1.content | from_json | first).name
            if (item.1.status | default(0)) == 200
               and (item.1.content | default('') | trim)[:1] == '['
               and (item.1.content | from_json | length) > 0
            else ''
          )
        )
      })] }}
  loop: "{{ splunkbase_entries | zip(splunkbase_release_q.results) | list }}"
  loop_control:
    label: "{{ item.0.filename }}"

- name: Warn about entries whose latest version could not be resolved
  ansible.builtin.debug:
    msg: >-
      Could not resolve a version for {{ item.filename }}
      (splunkbase_id {{ item.splunkbase_id }}); skipping it this run.
  loop: "{{ splunkbase_desired_all | selectattr('desired_version', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.filename }}"

- name: Keep only resolvable entries
  ansible.builtin.set_fact:
    splunkbase_desired: >-
      {{ splunkbase_desired_all | rejectattr('desired_version', 'equalto', '') | list }}

# `aws s3api get-object-tagging` returns nonzero for a missing object
# ("NoSuchKey" in stderr) — expected, drives a sync. Any other nonzero
# (auth/network/bucket) must fail loud, validated in the next task.
# `--query`/`--output text` reduces the reply to the bare tag value, or
# empty when the object carries no `version` tag.
- name: Query current object-storage version tag for each entry
  ansible.builtin.command:
    argv:
      - aws
      - s3api
      - get-object-tagging
      - --bucket
      - "{{ object_storage_bucket }}"
      - --key
      - "{{ item.filename }}"
      - --query
      - TagSet[?Key=='version'].Value
      - --output
      - text
  environment: "{{ s3_env }}"
  loop: "{{ splunkbase_desired }}"
  loop_control:
    label: "{{ item.filename }}"
  register: object_storage_tag_query
  changed_when: false
  failed_when: false
  no_log: true

- name: Validate query errors are only missing-object cases
  ansible.builtin.assert:
    that:
      - >-
        item.rc == 0
        or 'NoSuchKey' in ((item.stdout | default('')) ~ (item.stderr | default('')))
    fail_msg: >-
      get-object-tagging failed for {{ item.item.filename }} with rc={{ item.rc }}.
      Not a "missing object" — check object-storage connectivity, the
      credentials preflight resolved from platform/object-storage, and bucket
      existence.
    quiet: true
  loop: "{{ object_storage_tag_query.results }}"
  loop_control:
    label: "{{ item.item.filename }}"

- name: Compute sync decisions (bucket tag vs resolved latest)
  ansible.builtin.set_fact:
    splunkbase_plan: >-
      {{ splunkbase_plan | default([]) + [item.item | combine({
        'current_version': (item.stdout | default('') | trim) if item.rc == 0 else '',
        'needs_sync': (
          item.rc != 0
          or (item.stdout | default('') | trim)
             != (item.item.desired_version | string | trim)
        ),
      })] }}
  loop: "{{ object_storage_tag_query.results }}"
  loop_control:
    label: "{{ item.item.filename }}"

- name: Show sync decisions
  ansible.builtin.debug:
    msg: >-
      {{ item.filename }}: latest={{ item.desired_version }}
      store={{ item.current_version or '(none)' }}
      → {{ 'SYNC' if item.needs_sync else 'skip' }}
  loop: "{{ splunkbase_plan }}"
  loop_control:
    label: "{{ item.filename }}"

- name: Build list of entries that need sync
  ansible.builtin.set_fact:
    splunkbase_to_sync: "{{ splunkbase_plan | selectattr('needs_sync') | list }}"

- name: Authenticate to Splunkbase (only when something needs downloading)
  ansible.builtin.uri:
    url: "{{ splunkbase_api }}/api/account:login/"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ splunkbase_secrets.SPLUNKBASE_USERNAME }}"
      password: "{{ splunkbase_secrets.SPLUNKBASE_PASSWORD }}"
    return_content: true
    status_code: 200
  register: splunkbase_login
  when: splunkbase_to_sync | length > 0
  no_log: true

- name: Extract Splunkbase session token
  ansible.builtin.set_fact:
    splunkbase_token: >-
      {{ splunkbase_login.content
         | regex_search('<id>([^<]+)</id>', '\1')
         | default([], true)
         | first | default('') }}
  when: splunkbase_to_sync | length > 0
  no_log: true

- name: Fail if session token not returned
  ansible.builtin.assert:
    that:
      - splunkbase_token is defined
      - splunkbase_token | length > 0
    fail_msg: >-
      Splunkbase login returned no session token. The credentials were read
      successfully from platform/splunk/main (a failed read would have stopped
      the run in preflight), so this is a rejected login rather than a missing
      secret — check the account itself.
  when: splunkbase_to_sync | length > 0

- name: Download drifted entries from Splunkbase
  ansible.builtin.get_url:
    url: >-
      {{ splunkbase_api }}/app/{{ item.splunkbase_id }}/release/{{ item.desired_version }}/download/
    dest: "{{ splunkbase_sync_tmpdir }}/{{ item.filename }}"
    headers:
      X-Auth-Token: "{{ splunkbase_token }}"
    force: true
    mode: "0600"
    timeout: 120
  loop: "{{ splunkbase_to_sync }}"
  loop_control:
    label: "{{ item.filename }} v{{ item.desired_version }}"

- name: Upload synced archives to object storage
  ansible.builtin.command:
    argv:
      - aws
      - s3
      - cp
      - "{{ splunkbase_sync_tmpdir }}/{{ item.filename }}"
      - "s3://{{ object_storage_bucket }}/{{ item.filename }}"
  environment: "{{ s3_env }}"
  loop: "{{ splunkbase_to_sync }}"
  loop_control:
    label: "{{ item.filename }}"
  changed_when: true

# Tag every desired entry (not only re-uploads). Pre-native-versioning objects
# often lack channel=latest; verify-manifest requires it on every key.
- name: Tag object-storage objects as the current latest release
  ansible.builtin.command:
    argv:
      - aws
      - s3api
      - put-object-tagging
      - --bucket
      - "{{ object_storage_bucket }}"
      - --key
      - "{{ item.filename }}"
      - --tagging
      - "{{ {'TagSet': [
             {'Key': 'channel', 'Value': 'latest'},
             {'Key': 'version', 'Value': item.desired_version | string | trim},
             {'Key': 'splunkbase_id', 'Value': item.splunkbase_id | string}]} | to_json }}"
  environment: "{{ s3_env }}"
  loop: "{{ splunkbase_desired }}"
  loop_control:
    label: "{{ item.filename }}"
  changed_when: true

- name: Remove downloaded archives from controller tmpdir
  ansible.builtin.file:
    path: "{{ splunkbase_sync_tmpdir }}/{{ item.filename }}"
    state: absent
  loop: "{{ splunkbase_to_sync }}"
  loop_control:
    label: "{{ item.filename }}"

- name: Read existing manifest for a scoped update
  ansible.builtin.command:
    argv:
      - aws
      - s3
      - cp
      - "s3://{{ object_storage_bucket }}/manifest.json"
      - "-"
  environment: "{{ s3_env }}"
  register: existing_splunkbase_manifest
  changed_when: false
  failed_when: false
  when: splunkbase_manifest_is_partial | bool
  no_log: true

- name: Verify scoped update can preserve the existing manifest
  ansible.builtin.assert:
    that:
      - existing_splunkbase_manifest.rc == 0
      - existing_splunkbase_manifest.stdout | default('{}', true) | from_json is mapping
    fail_msg: >-
      A scoped update must read the existing manifest.json before publishing.
      Run the complete update scope to rebuild a missing or invalid manifest.
    quiet: true
  when: splunkbase_manifest_is_partial | bool

- name: Initialize manifest for this update scope
  ansible.builtin.set_fact:
    splunkbase_manifest: >-
      {{ (existing_splunkbase_manifest.stdout | default('{}', true) | from_json)
         if splunkbase_manifest_is_partial | bool else {} }}

- name: Build manifest (app_dir → {version, filename})
  ansible.builtin.set_fact:
    splunkbase_manifest: >-
      {{ splunkbase_manifest | default({}) | combine({
        item.app_dir: {'version': item.desired_version, 'filename': item.filename}
      }) }}
  loop: "{{ splunkbase_desired }}"
  loop_control:
    label: "{{ item.app_dir }}"

- name: Write manifest to controller tmpdir
  ansible.builtin.copy:
    content: "{{ splunkbase_manifest | to_nice_json }}\n"
    dest: "{{ splunkbase_sync_tmpdir }}/manifest.json"
    mode: "0600"

- name: Publish manifest.json to object storage
  ansible.builtin.command:
    argv:
      - aws
      - s3
      - cp
      - "{{ splunkbase_sync_tmpdir }}/manifest.json"
      - "s3://{{ object_storage_bucket }}/manifest.json"
  environment: "{{ s3_env }}"
  changed_when: true

- name: Remove manifest from controller tmpdir
  ansible.builtin.file:
    path: "{{ splunkbase_sync_tmpdir }}/manifest.json"
    state: absent

- name: Summary
  ansible.builtin.debug:
    msg: >-
      Splunkbase sync complete.
      {{ splunkbase_to_sync | length }} of
      {{ splunkbase_desired | length }} resolvable entries updated;
      manifest.json published with {{ splunkbase_manifest | length }} apps.
