---
- name: Resolve latest release per Splunkbase entry
  ansible.builtin.uri:
    url: "{{ splunkbase_api }}/api/v1/app/{{ item.splunkbase_id }}/release/"
    method: GET
    return_content: true
    status_code: 200
    timeout: 30
  check_mode: false
  register: splunkbase_release_q
  loop: "{{ splunkbase_entries }}"
  loop_control:
    label: "app {{ item.splunkbase_id }}"
  changed_when: false
  failed_when: false

- name: Initialize resolved release versions
  ansible.builtin.set_fact:
    splunkbase_desired_all: []

- name: Compute every resolved release's desired version
  ansible.builtin.set_fact:
    splunkbase_desired_all: >-
      {{ splunkbase_desired_all + [item.0 | combine({
        'desired_version': (
          item.0.pin_version if item.0.pin_version is defined
          else (
            (item.1.content | from_json | first).name
            if (item.1.status | default(0)) == 200
               and (item.1.content | default('') | trim)[:1] == '['
               and (item.1.content | from_json | length) > 0
            else ''
          )
        )
      })] }}
  loop: "{{ splunkbase_entries | zip(splunkbase_release_q.results) | list }}"
  loop_control:
    label: "{{ item.0.filename }}"

- name: Warn about entries whose latest version could not be resolved
  ansible.builtin.debug:
    msg: >-
      Could not resolve a version for {{ item.filename }}
      (splunkbase_id {{ item.splunkbase_id }}); skipping it this run.
  loop: "{{ splunkbase_desired_all | selectattr('desired_version', 'equalto', '') | list }}"
  loop_control:
    label: "{{ item.filename }}"

- name: Keep only resolvable entries
  ansible.builtin.set_fact:
    splunkbase_desired: >-
      {{ splunkbase_desired_all | rejectattr('desired_version', 'equalto', '') | list }}

- name: Initialize sync plan from resolvable entries
  ansible.builtin.set_fact:
    splunkbase_plan: "{{ splunkbase_desired }}"

- name: Fail closed when no configured Splunkbase version resolves
  ansible.builtin.assert:
    that:
      - splunkbase_entries | length == 0 or splunkbase_desired | length > 0
    fail_msg: >-
      Splunkbase release resolution produced no versions for any of
      {{ splunkbase_entries | length }} configured entries. Check the release
      API status, response format, and controller connectivity; object storage
      was not changed.
    quiet: true
  when: not (splunkbase_sync_fail_open | default(true) | bool)

# `aws s3api get-object-tagging` returns nonzero for a missing object
# ("NoSuchKey" in stderr) — expected, drives a sync. Any other nonzero
# (auth/network/bucket) must fail loud, validated in the next task.
# Read the complete TagSet so sync decisions can verify every required tag
# using the same read-only query.
- name: Query current object-storage version tag for each entry
  ansible.builtin.command:
    argv:
      - aws
      - s3api
      - get-object-tagging
      - --bucket
      - "{{ object_storage_bucket }}"
      - --key
      - "{{ item.filename }}"
      - --query
      - TagSet
      - --output
      - json
  environment: "{{ s3_env }}"
  loop: "{{ splunkbase_desired }}"
  loop_control:
    label: "{{ item.filename }}"
  register: object_storage_tag_query
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Validate query errors are only missing-object cases
  ansible.builtin.assert:
    that:
      - >-
        item.rc == 0
        or 'NoSuchKey' in ((item.stdout | default('')) ~ (item.stderr | default('')))
    fail_msg: >-
      get-object-tagging failed for {{ item.item.filename }} with rc={{ item.rc }}.
      Not a "missing object" — check object-storage connectivity,
      OBJECT_STORAGE_ROOT_USER/PASSWORD, and bucket existence.
    quiet: true
  loop: "{{ object_storage_tag_query.results }}"
  loop_control:
    label: "{{ item.item.filename }}"

- name: Compute sync decisions (bucket tag vs resolved latest)
  ansible.builtin.set_fact:
    splunkbase_plan: >-
      {{ (splunkbase_plan
          | rejectattr('filename', 'equalto', item.item.filename) | list)
         + [item.item | combine({
        'current_tags': current_object_tags,
        'current_version': current_object_tags.get('version', ''),
        'needs_sync': (
          item.rc != 0
          or current_object_tags.get('version', '') != desired_object_tags.version
        ),
        'needs_tag': item.rc != 0 or current_object_tags != desired_object_tags,
      })] }}
  loop: "{{ object_storage_tag_query.results }}"
  loop_control:
    label: "{{ item.item.filename }}"
  vars:
    current_object_tags: >-
      {{ (item.stdout | from_json | default([], true)
          | items2dict(key_name='Key', value_name='Value'))
         if item.rc == 0 else {} }}
    desired_object_tags:
      channel: latest
      version: "{{ item.item.desired_version | string | trim }}"
      splunkbase_id: "{{ item.item.splunkbase_id | string }}"

- name: Show sync decisions
  ansible.builtin.debug:
    msg: >-
      {{ item.filename }}: latest={{ item.desired_version }}
      store={{ item.current_version or '(none)' }}
      → {{ 'SYNC' if item.needs_sync else 'skip' }}
  loop: "{{ splunkbase_plan }}"
  loop_control:
    label: "{{ item.filename }}"

- name: End Splunkbase sync play after the check-mode preview
  ansible.builtin.meta: end_play
  when: ansible_check_mode

- name: Build list of entries that need sync
  ansible.builtin.set_fact:
    splunkbase_to_sync: "{{ splunkbase_plan | selectattr('needs_sync') | list }}"

- name: Authenticate to Splunkbase (only when something needs downloading)
  ansible.builtin.uri:
    url: "{{ splunkbase_api }}/api/account:login/"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ lookup('env', 'SPLUNKBASE_USERNAME') }}"
      password: "{{ lookup('env', 'SPLUNKBASE_PASSWORD') }}"
    return_content: true
    status_code: 200
  register: splunkbase_login
  when: splunkbase_to_sync | length > 0
  no_log: true

- name: Extract Splunkbase session token
  ansible.builtin.set_fact:
    splunkbase_token: >-
      {{ splunkbase_login.content
         | regex_search('<id>([^<]+)</id>', '\1')
         | default([], true)
         | first | default('') }}
  when: splunkbase_to_sync | length > 0
  no_log: true

- name: Fail if session token not returned
  ansible.builtin.assert:
    that:
      - splunkbase_token is defined
      - splunkbase_token | length > 0
    fail_msg: >-
      Splunkbase login returned no session token. Check
      SPLUNKBASE_USERNAME / SPLUNKBASE_PASSWORD.
  when: splunkbase_to_sync | length > 0

- name: Download drifted entries from Splunkbase
  ansible.builtin.get_url:
    url: >-
      {{ splunkbase_api }}/app/{{ item.splunkbase_id }}/release/{{ item.desired_version }}/download/
    dest: "{{ splunkbase_sync_tmpdir }}/{{ item.filename }}"
    headers:
      X-Auth-Token: "{{ splunkbase_token }}"
    force: true
    mode: "0600"
    timeout: 120
  loop: "{{ splunkbase_to_sync }}"
  loop_control:
    label: "{{ item.filename }} v{{ item.desired_version }}"

- name: Upload synced archives to object storage
  ansible.builtin.command:
    argv:
      - aws
      - s3
      - cp
      - "{{ splunkbase_sync_tmpdir }}/{{ item.filename }}"
      - "s3://{{ object_storage_bucket }}/{{ item.filename }}"
  environment: "{{ s3_env }}"
  loop: "{{ splunkbase_to_sync }}"
  loop_control:
    label: "{{ item.filename }}"
  changed_when: true

- name: Tag object-storage objects as the current latest release
  ansible.builtin.command:
    argv:
      - aws
      - s3api
      - put-object-tagging
      - --bucket
      - "{{ object_storage_bucket }}"
      - --key
      - "{{ item.filename }}"
      - --tagging
      - "{{ {'TagSet': [
             {'Key': 'channel', 'Value': 'latest'},
             {'Key': 'version', 'Value': item.desired_version | string | trim},
             {'Key': 'splunkbase_id', 'Value': item.splunkbase_id | string}]} | to_json }}"
  environment: "{{ s3_env }}"
  loop: "{{ splunkbase_plan }}"
  loop_control:
    label: "{{ item.filename }}"
  changed_when: item.needs_tag
  when: item.needs_tag

- name: Remove downloaded archives from controller tmpdir
  ansible.builtin.file:
    path: "{{ splunkbase_sync_tmpdir }}/{{ item.filename }}"
    state: absent
  loop: "{{ splunkbase_to_sync }}"
  loop_control:
    label: "{{ item.filename }}"

- name: Read existing manifest for scoped updates and change detection
  ansible.builtin.command:
    argv:
      - aws
      - s3
      - cp
      - "s3://{{ object_storage_bucket }}/manifest.json"
      - "-"
  environment: "{{ s3_env }}"
  register: existing_splunkbase_manifest
  changed_when: false
  failed_when: false
  when: splunkbase_plan | length > 0
  no_log: true

- name: Verify scoped update can preserve the existing manifest
  ansible.builtin.assert:
    that:
      - existing_splunkbase_manifest.rc == 0
      - existing_splunkbase_manifest.stdout | default('{}', true) | from_json is mapping
    fail_msg: >-
      A scoped update must read the existing manifest.json before publishing.
      Run the complete update scope to rebuild a missing or invalid manifest.
    quiet: true
  when:
    - splunkbase_manifest_is_partial | bool
    - splunkbase_plan | length > 0

- name: Initialize manifest for this update scope
  ansible.builtin.set_fact:
    splunkbase_manifest: >-
      {{ (existing_splunkbase_manifest.stdout | default('{}', true) | from_json)
         if splunkbase_manifest_is_partial | bool else {} }}
  when: splunkbase_plan | length > 0

- name: Build manifest (app_dir → {version, filename})
  ansible.builtin.set_fact:
    splunkbase_manifest: >-
      {{ splunkbase_manifest | default({}) | combine({
        item.app_dir: {'version': item.desired_version, 'filename': item.filename}
      }) }}
  loop: "{{ splunkbase_desired }}"
  loop_control:
    label: "{{ item.app_dir }}"

- name: Initialize published manifest comparison
  ansible.builtin.set_fact:
    splunkbase_published_manifest: {}
    splunkbase_published_manifest_readable: false
  changed_when: false
  when: splunkbase_plan | length > 0

- name: Parse published manifest when readable
  when:
    - splunkbase_plan | length > 0
    - existing_splunkbase_manifest.rc == 0
  block:
    - name: Parse published manifest JSON
      ansible.builtin.set_fact:
        splunkbase_published_manifest: "{{ existing_splunkbase_manifest.stdout | from_json }}"
        splunkbase_published_manifest_readable: true
      changed_when: false
      no_log: true
  rescue:
    - name: Mark published manifest as unreadable
      ansible.builtin.set_fact:
        splunkbase_published_manifest_readable: false
      changed_when: false
      no_log: true

- name: Decide whether the published manifest needs an update
  ansible.builtin.set_fact:
    splunkbase_manifest_needs_publish: >-
      {{ not (splunkbase_published_manifest_readable | bool)
         or splunkbase_published_manifest != splunkbase_manifest }}
  changed_when: false
  when: splunkbase_plan | length > 0

- name: Write manifest to controller tmpdir
  ansible.builtin.copy:
    content: "{{ splunkbase_manifest | to_nice_json }}\n"
    dest: "{{ splunkbase_sync_tmpdir }}/manifest.json"
    mode: "0600"
  when:
    - splunkbase_plan | length > 0
    - splunkbase_manifest_needs_publish | bool

- name: Publish manifest.json to object storage
  ansible.builtin.command:
    argv:
      - aws
      - s3
      - cp
      - "{{ splunkbase_sync_tmpdir }}/manifest.json"
      - "s3://{{ object_storage_bucket }}/manifest.json"
  environment: "{{ s3_env }}"
  changed_when: splunkbase_manifest_needs_publish | bool
  when:
    - splunkbase_plan | length > 0
    - splunkbase_manifest_needs_publish | bool

- name: Remove manifest from controller tmpdir
  ansible.builtin.file:
    path: "{{ splunkbase_sync_tmpdir }}/manifest.json"
    state: absent
  when: splunkbase_plan | length > 0

- name: Report empty Splunkbase plan
  ansible.builtin.debug:
    msg: >-
      Nothing to sync; the resolved plan is empty, so the existing bucket and
      manifest.json were left unchanged.
  when: splunkbase_plan | length == 0

- name: Summary
  ansible.builtin.debug:
    msg: >-
      Splunkbase sync complete.
      {{ splunkbase_to_sync | length }} of
      {{ splunkbase_desired | length }} resolvable entries updated;
      manifest.json published with {{ splunkbase_manifest | length }} apps.
  when: splunkbase_plan | length > 0
