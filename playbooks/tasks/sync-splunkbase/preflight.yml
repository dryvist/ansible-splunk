---
# Credential resolution + object-storage client checks for the Splunkbase mirror.
#
# WHY THIS READS OPENBAO RATHER THAN THE ENVIRONMENT.
# This file used to assert four environment variables and tell the reader to
# re-run under a laptop secrets manager. That instruction is unfollowable from
# the unattended execution plane, which has no such wrapper — so `splunk-site`
# failed here on every run, and the failure read as "a secret is missing" when
# the secrets existed in OpenBao all along and the run simply had no way to
# reach them.
#
# The read is community.hashi_vault (already pinned in requirements.yml, and
# already how roles/openbao_secrets reads in the sibling repo). It takes its
# address and token from VAULT_ADDR / VAULT_TOKEN, which scripts/run-ansible.sh
# exports from the AppRole login it already performs to mint the run's SSH
# certificate. Nothing here logs in, and nothing here holds a credential of its
# own.
#
# A failed read raises. That is the wanted behaviour: a 403 from a missing
# policy grant must stop the run rather than fall through to an empty value
# that surfaces later as a Splunkbase rejection or a SigV4 error.

- name: Resolve the mirror's credentials from OpenBao
  ansible.builtin.set_fact:
    splunkbase_secrets: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', 'platform/splunk/main').secret }}
    # S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY here are the same credential the
    # shared inventory resolver already uses, read from the path the
    # ansible-converge policy already grants.
    object_storage_secrets: >-
      {{ lookup('community.hashi_vault.vault_kv2_get', 'platform/object-storage').secret }}
  no_log: true

# Without this, an absent `aws` surfaces as rc=2 from every object-storage
# command, which the tag-query validation below reports as an object-storage
# fault - sending the reader to check connectivity, credentials, and bucket
# existence, none of which are wrong. Fail once, here, naming the real cause.
- name: Look for the object-storage client
  ansible.builtin.command:
    cmd: aws --version
  changed_when: false
  failed_when: false
  register: s3_client_preflight

- name: Assert the object-storage client is installed
  ansible.builtin.assert:
    that:
      - s3_client_preflight.rc == 0
    fail_msg: >-
      `aws` is not on PATH. Every object-storage command below would exit 2
      ("executable not found"), which reads as an object-storage fault but
      is not one. Install the AWS CLI into the dev shell and re-run.
    quiet: true

- name: Query object-storage bucket versioning
  ansible.builtin.command:
    argv:
      - aws
      - s3api
      - get-bucket-versioning
      - --bucket
      - "{{ object_storage_bucket }}"
  environment: "{{ s3_env }}"
  register: object_storage_versioning
  changed_when: false
  no_log: true

- name: Require object-storage version history for stable artifact keys
  ansible.builtin.assert:
    that:
      - (object_storage_versioning.stdout | default('{}', true) | from_json).Status | default('') == 'Enabled'
    fail_msg: >-
      Bucket {{ object_storage_bucket }} must have S3 versioning enabled. Stable,
      version-free artifact keys rely on native object VersionId history for
      rollback and audit.
    quiet: true
