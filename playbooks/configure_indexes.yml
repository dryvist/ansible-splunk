---
# Configure Splunk indexes
# Note: Indexes are configured via the splunk_docker role's indexes.conf template.
# This playbook exists for backwards compatibility and re-running configuration.

# The role reaches the artifact store using values from the published OpenTofu
# inventory. Without this import tofu_data is never defined and the run dies
# partway through on an undefined variable, after having already written config
# — a half-applied converge, which is worse than one that refuses to start.
# Every other playbook here imports it; this one was missed.
- name: Load OpenTofu inventory
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

- name: Configure Splunk indexes
  hosts: splunk
  become: true
  gather_facts: true

  tasks:
    - name: Validate required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', 'SPLUNK_PASSWORD') | length > 0
          - lookup('env', 'SPLUNK_HEC_TOKEN') | length > 0
        fail_msg: >-
          SPLUNK_PASSWORD and SPLUNK_HEC_TOKEN environment variables must be set
      run_once: true
      delegate_to: localhost

    - name: Set Splunk credentials from environment
      ansible.builtin.set_fact:
        splunk_docker_password: "{{ lookup('env', 'SPLUNK_PASSWORD') }}"
        splunk_docker_hec_token: "{{ lookup('env', 'SPLUNK_HEC_TOKEN') }}"
      no_log: true

    - name: Deploy Splunk Docker (includes index configuration)
      ansible.builtin.include_role:
        name: splunk_docker
