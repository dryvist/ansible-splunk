---
# Main site playbook for Splunk deployment
# This playbook orchestrates the complete deployment workflow

# Load dynamic inventory from OpenTofu outputs (if available)
- name: Load OpenTofu inventory
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

# Resolve the latest Splunkbase app versions and mirror them into the
# object-storage bucket BEFORE deploying, so every run installs current apps. Runs
# entirely on the controller (which has internet egress); the Splunk VM stays
# air-gapped and only pulls from object storage. Fail-soft: a Splunkbase outage is
# rescued inside this playbook and the deploy proceeds from whatever the bucket
# already holds. Requires the Splunkbase + object-storage secrets in the
# environment (provided by `doppler run --`).
- name: Sync latest Splunkbase apps into object storage (in-flow, fail-soft)
  ansible.builtin.import_playbook: sync-splunkbase.yml

# Configure NTP time synchronization BEFORE deploying Splunk. Splunk's
# _time correlation depends on accurate clocks; points at the Proxmox
# hosts (stratum-2 servers managed by ansible-proxmox) when Doppler
# provides PROXMOX_NTP_SERVERS, falls back to Debian public pool when not.
- name: Configure NTP time synchronization
  hosts: splunk
  become: true
  gather_facts: true
  tags:
    - ntp
    - time
  roles:
    - role: ntp
  post_tasks:
    - name: Flush NTP handlers so the timesyncd restart runs before Splunk deploys
      ansible.builtin.meta: flush_handlers

    - name: Wait for the clock to synchronize via systemd-timesyncd
      ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
      register: ntp_synced
      changed_when: false
      until: ntp_synced.stdout | trim == 'yes'
      retries: 12
      delay: 5
      when: ansible_virtualization_type | default('') != 'docker'
      tags:
        - ntp
        - time

- name: Deploy Splunk
  hosts: splunk
  become: true
  gather_facts: true

  # Load the role's index list up front so the per-index HEC token derivation
  # below can reference splunk_docker_indexes before the role is included
  # (mirrors playbooks/validate.yml).


  tasks:
    # Wrapped in block/always so the HEC completeness check at the bottom
    # fires no matter where in this sequence a task fails — a converge that
    # fails partway (or that silently "succeeds" after rendering an
    # incomplete inputs.conf) is exactly the condition that let 20 of 36
    # indexes run with no HEC listener for 9 days, undetected.
    - name: Deploy Splunk, then verify every configured index actually has a live HEC listener
      block:
        # Precedence trap: play-level vars_files (#14) clobbers inventory group_vars (#6).
        # Load defaults into a namespace here so pre-role tasks can fall back safely,
        # preserving any group_vars overrides before the role executes.
        #
        # `_splunk_docker_defaults.splunk_docker_indexes` (the combine of
        # splunk_docker_indexes_core + splunk_docker_indexes_extra, defined in
        # 10-custom-indexes-extra.yml) is unusable here: normal role-defaults
        # merging flattens all default files into one namespace before that
        # combine template is ever evaluated, but include_vars: dir: with name:
        # loads it lazily, so at access time `splunk_docker_indexes_core` (a bare
        # name living in a SIBLING file) isn't in scope and the combine dies with
        # "'splunk_docker_indexes_core' is undefined". Every call site below
        # reconstructs the same combine directly from the two namespaced halves
        # instead of trusting the pre-combined field.
        - name: Load splunk_docker role defaults (namespaced, pre-role fallback)
          ansible.builtin.include_vars:
            dir: ../roles/splunk_docker/defaults/main
            name: _splunk_docker_defaults

        # These three used to be asserted as environment variables with the
        # advice "use doppler run". An unattended run has no such wrapper, so
        # that advice was unfollowable and the assert simply stopped the run.
        # community.hashi_vault (pinned in requirements.yml) reads them from
        # OpenBao using VAULT_ADDR / VAULT_TOKEN, which scripts/run-ansible.sh
        # exports from the AppRole login it already performs. A failed read
        # raises, so a missing policy grant stops the run instead of silently
        # yielding an empty credential.
        - name: Read the Splunk platform credentials from OpenBao
          ansible.builtin.set_fact:
            splunk_platform_secrets: >-
              {{ lookup('community.hashi_vault.vault_kv2_get',
                        'platform/splunk/main').secret }}
          no_log: true
          run_once: true
          delegate_to: localhost

        - name: Set Splunk credentials
          ansible.builtin.set_fact:
            splunk_docker_password: "{{ splunk_platform_secrets.SPLUNK_PASSWORD }}"
            # HEC_NAMESPACE is not optional and its absence is silent: every
            # per-index HEC token derives from it, so a run without it
            # re-templates inputs.conf down to the legacy token alone and drops
            # every per-index sender — a live multi-index ingest outage on the
            # next restart.
            splunk_docker_hec_namespace: "{{ splunk_platform_secrets.HEC_NAMESPACE }}"
            splunk_docker_hec_token: "{{ splunk_platform_secrets.SPLUNK_HEC_TOKEN }}"
          no_log: true
          run_once: true
          delegate_to: localhost

        - name: Validate HEC_NAMESPACE is a valid UUID
          ansible.builtin.assert:
            that:
              - splunk_docker_hec_namespace is match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$')
            fail_msg: >-
              HEC_NAMESPACE must be a valid UUID (e.g. uuidgen output).
              Got: {{ splunk_docker_hec_namespace | default('(empty)') }}

        # Derive a dedicated per-index HEC token via UUID v5 (Ansible core to_uuid:
        # uuid5('splunk-hec-<index>', HEC_NAMESPACE)). The legacy token deliberately
        # stays = SPLUNK_HEC_TOKEN (NOT derived) so rotating it does not disturb
        # per-index tokens — senders migrate to their per-index token one at a
        # time, then legacy is retired.
        - name: Derive per-index HEC token values from namespace
          vars:
            index_names: >-
              {{ (splunk_docker_indexes | default((_splunk_docker_defaults.splunk_docker_indexes_core +
                 _splunk_docker_defaults.splunk_docker_indexes_extra))) | map(attribute='name') | list }}
          ansible.builtin.set_fact:
            splunk_docker_hec_token_values: >-
              {{
                dict(index_names | zip(
                  index_names | map('regex_replace', '^', 'splunk-hec-') | map('to_uuid', splunk_docker_hec_namespace)
                )) | combine({'legacy': splunk_docker_hec_token})
              }}
          no_log: true

        - name: Deploy Splunk Docker
          ansible.builtin.include_role:
            name: splunk_docker
          # `always`, so that --tags reaches INSIDE the role. A dynamic
          # include_role is itself a task: an untagged one is filtered out by
          # any --tags run, and the tags on the role's own tasks
          # (splunk_docker uses `alerting`) are then never evaluated. The
          # symptom is a converge that reports ok=1 and changes nothing while
          # looking like it ran. This does not widen what a tagged run does —
          # inside the role, only tasks matching the requested tag execute.
          tags:
            - always
      always:
        - name: Verify every configured index has a live, enabled HEC input stanza
          ansible.builtin.include_tasks: ../roles/splunk_docker/tasks/verify_hec_completeness.yml
          when: _splunk_docker_defaults is defined

  post_tasks:
    - name: Wait for Splunk to be ready after any restarts
      ansible.builtin.include_role:
        name: splunk_docker
        tasks_from: wait_for_splunk

- name: Apply systemd restart policies
  hosts: splunk
  become: true
  gather_facts: false
  tags:
    - restart-policy
    - hardening

  roles:
    - role: systemd_restart_policy
      vars:
        systemd_restart_policy_services:
          - docker
