---
# Validation playbook to verify Splunk Docker deployment
# Run this after deploy.yml to verify success
#
# Usage:
#   ansible-playbook playbooks/validate.yml

- name: Load OpenTofu inventory
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

- name: Validate Splunk Docker deployment
  hosts: splunk
  become: true
  gather_facts: true


  vars:
    validation_results: []

  # Split across playbooks/tasks/validate/ (one file per validation area:
  # setup, docker/container, ports+HEC, config files+addons, MCP+Java,
  # disk+freeze-path, summary) rather than one flat tasks: list — an agent
  # debugging one check should not have to read every other check to find it.
  tasks:
    - name: Load defaults and derive HEC token values
      ansible.builtin.include_tasks: tasks/validate/00-setup.yml

    - name: Validate Docker service and Splunk container
      ansible.builtin.include_tasks: tasks/validate/01-docker-container.yml

    - name: Validate listening ports and HEC ingestion
      ansible.builtin.include_tasks: tasks/validate/02-ports-and-hec.yml

    - name: Validate rendered config files and installed add-ons
      ansible.builtin.include_tasks: tasks/validate/03-config-files-and-addons.yml

    - name: Validate MCP Server API and Java/DB Connect
      ansible.builtin.include_tasks: tasks/validate/04-mcp-and-java.yml

    - name: Validate disk headroom and freeze-path health
      ansible.builtin.include_tasks: tasks/validate/05-disk-and-freeze.yml

    - name: Display validation summary and fail on any check failure
      ansible.builtin.include_tasks: tasks/validate/06-summary.yml
