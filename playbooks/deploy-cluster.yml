---
# Deploy the Splunk-native HA cluster (Phase 3): a 2-peer indexer cluster, two
# independent search heads, and one management node (cluster manager + license
# master + monitoring console + a third unclustered search head), via the
# vendored splunk.splunk role. See docs/SPLUNK_CLUSTER_DESIGN.md.
#
# This does NOT touch the legacy all-in-one Splunk (playbooks/deploy.yml,
# splunk_docker role) — the AIO is disable-never-delete and stays a search peer
# during migration.
#
# Usage:
#   doppler run -- ansible-playbook -i inventory/hosts.yml \
#     playbooks/deploy-cluster.yml
#
# Required environment (injection-agnostic; wrapper supplies them):
#   SPLUNK_PASSWORD, SPLUNK_PACKAGE_URL_FULL, SPLUNK_IDXC_PASS4SYMMKEY,
#   SPLUNK_GENERAL_PASS4SYMMKEY, PROXMOX_DOMAIN, PROXMOX_SSH_KEY_PATH,
#   SPLUNK_LICENSE (raw .lic XML — clustering cannot run on a Free license)

- name: Load OpenTofu inventory
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

- name: Validate cluster secrets are present
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Assert required environment variables
      ansible.builtin.assert:
        that:
          - lookup('env', 'SPLUNK_PASSWORD') | length > 0
          - lookup('env', 'SPLUNK_PACKAGE_URL_FULL') | length > 0
          - lookup('env', 'SPLUNK_IDXC_PASS4SYMMKEY') | length > 0
          - lookup('env', 'SPLUNK_GENERAL_PASS4SYMMKEY') | length > 0
          - lookup('env', 'PROXMOX_DOMAIN') | length > 0
          - lookup('env', 'SPLUNK_LICENSE') | length > 0
          - lookup('env', 'PROXMOX_SSH_KEY_PATH') | length > 0
        fail_msg: >-
          Set SPLUNK_PASSWORD, SPLUNK_PACKAGE_URL_FULL,
          SPLUNK_IDXC_PASS4SYMMKEY, SPLUNK_GENERAL_PASS4SYMMKEY,
          PROXMOX_DOMAIN, SPLUNK_LICENSE and PROXMOX_SSH_KEY_PATH
          (doppler run -- ansible-playbook ...).

# Order matters: install everywhere, then license master, then cluster manager,
# then peers, then attach search heads, then the monitoring console.

- name: Install Splunk on all cluster hosts
  hosts: splunk_cluster
  become: true
  serial: 2
  vars:
    deployment_task: check_splunk.yml
  roles:
    - role: splunk.splunk

- name: Configure the license master
  hosts: licensemaster
  become: true
  vars:
    deployment_task: configure_license.yml
  roles:
    - role: splunk.splunk
  # After the role, not before: splunk_home is `auto_determined` in the role
  # defaults and only resolves once the role has run, and the role creates
  # etc/licenses/enterprise/. Handlers flush at end of play, so the role's
  # active_group change and this write coalesce into ONE restart.
  tasks:
    - name: Install the Splunk license
      ansible.builtin.copy:
        # `content` checksums against the remote file, so this is the whole
        # auto-apply mechanism: unchanged is a no-op, a changed license
        # rewrites and restarts. Fixed filename — Splunk stacks every file in
        # this directory, so a stable name replaces rather than accumulates.
        content: "{{ splunk_license_xml }}"
        dest: "{{ splunk_home }}/etc/licenses/enterprise/enterprise.lic"
        owner: "{{ splunk_nix_user }}"
        group: "{{ splunk_nix_group }}"
        mode: "0600"
      no_log: true
      notify: restart splunk

- name: Configure the indexer cluster manager
  hosts: clustermanager
  become: true
  vars:
    deployment_task: configure_idxc_manager.yml
  roles:
    - role: splunk.splunk

- name: Configure indexer cluster peers
  hosts: indexer
  become: true
  vars:
    deployment_task: configure_idxc_member.yml
  roles:
    - role: splunk.splunk

- name: Attach search heads to the indexer cluster
  hosts: search
  become: true
  vars:
    deployment_task: configure_idxc_sh.yml
  roles:
    - role: splunk.splunk

- name: Configure the monitoring console
  hosts: dmc
  become: true
  vars:
    deployment_task: configure_dmc.yml
  roles:
    - role: splunk.splunk
