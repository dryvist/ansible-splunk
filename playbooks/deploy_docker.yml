---
# Deploy Splunk via Docker container
# This playbook uses the splunk_docker role for containerized deployment
#
# Prerequisites:
# - Doppler secrets loaded (SPLUNK_PASSWORD, SPLUNK_HEC_TOKEN)
# - OpenTofu inventory resolvable (S3 read creds, local cache, or TOFU_INVENTORY_PATH)
#
# Usage:
#   doppler run -- uv run ansible-playbook playbooks/deploy_docker.yml

# Load dynamic inventory from OpenTofu outputs
# This assumes the standard repo layout: playbooks/ and inventory/ are sibling directories.
- name: Load OpenTofu inventory
  ansible.builtin.import_playbook: ../inventory/load_tofu.yml

- name: Deploy Splunk (Docker)
  hosts: splunk
  become: true
  gather_facts: true

  vars:
    splunk_docker_password: "{{ lookup('env', 'SPLUNK_PASSWORD') | mandatory('SPLUNK_PASSWORD environment variable must be set for Splunk Docker password') }}"
    splunk_docker_hec_token: "{{ lookup('env', 'SPLUNK_HEC_TOKEN') | mandatory('SPLUNK_HEC_TOKEN environment variable must be set for Splunk HEC token') }}"

  tasks:
    # import_role, NOT include_role. A dynamic include is opaque to tag
    # selection: tags on tasks inside the role are never evaluated, so the
    # include task itself is filtered out and the entire role is skipped. The
    # play then reports zero tasks and exits 0, which is indistinguishable from
    # "already converged" — the same silent-success shape the role tags exist
    # to avoid. A static import propagates tags into the role, so
    # `--tags alerting` selects exactly the alert-configuration tasks.
    - name: Deploy Splunk Docker container
      ansible.builtin.import_role:
        name: splunk_docker
