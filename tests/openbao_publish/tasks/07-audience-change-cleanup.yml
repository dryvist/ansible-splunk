---
# set_fact, not block vars: earlier scenarios set these as facts, which outrank block vars.
- name: Load the audience-change scenario
  ansible.builtin.set_fact:
    splunk_user: "{{ platform_search_mint_fixture.splunk_user }}"
    splunk_docker_user_token_audience: "{{ platform_search_mint_fixture.splunk_docker_user_token_audience }}"
    splunk_docker_new_token_id: "{{ platform_search_mint_fixture.splunk_docker_new_token_id }}"
    splunk_docker_token_list: "{{ platform_search_mint_fixture.splunk_docker_token_list }}"

- name: Exercise reconciliation and cleanup after a token audience change
  block:
    - name: Include all owner tokens in the post-publication cleanup plan
      ansible.builtin.include_tasks: ../../../roles/splunk_docker/tasks/plan_token_reconciliation.yml

    - name: Select old-audience tokens for post-publication cleanup
      ansible.builtin.include_tasks: ../../../roles/splunk_docker/tasks/plan_token_cleanup.yml

    - name: Save audience-change cleanup result
      ansible.builtin.set_fact:
        audience_change_matching_ids: "{{ splunk_docker_matching_tokens | map(attribute='name') | list }}"
        audience_change_eligible_ids: "{{ splunk_docker_eligible_tokens | map(attribute='name') | list }}"
        audience_change_cleanup_ids: "{{ splunk_docker_noncanonical_eligible_tokens | map(attribute='name') | list }}"

- name: Assert old-audience token is in cleanup after replacement is published
  ansible.builtin.assert:
    that:
      - audience_change_matching_ids == ['old-mcp-token', 'platform-minted-id']
      - audience_change_eligible_ids == ['old-mcp-token', 'platform-minted-id']
      - audience_change_cleanup_ids == ['old-mcp-token']
