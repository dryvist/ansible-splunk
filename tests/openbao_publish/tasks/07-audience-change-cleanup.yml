---
# set_fact, not block vars: earlier scenarios set these as facts, which outrank block vars.
- name: Load the audience-change scenario
  ansible.builtin.set_fact:
    splunk_user: >-
      {{ platform_search_mint_fixture.splunk_user
         | combine({'token_extra_audiences': ['llamaindex-agent-sessions']}) }}
    splunk_docker_user_token_audience: "{{ platform_search_mint_fixture.splunk_docker_user_token_audience }}"
    splunk_docker_new_token_id: "{{ platform_search_mint_fixture.splunk_docker_new_token_id }}"
    splunk_docker_token_list:
      json:
        entry: >-
          {{ platform_search_mint_fixture.splunk_docker_token_list.json.entry
             + [{'name': 'llamaindex-agent-token',
                 'content': {'status': 'enabled',
                             'claims': {'sub': 'svc-platform-search',
                                        'aud': 'llamaindex-agent-sessions',
                                        'nbr': 0,
                                        'exp': 0}}}] }}

- name: Exercise audience-change cleanup while preserving an extra audience
  block:
    - name: Include cleanup candidates and exclude the user's extra audience
      ansible.builtin.include_tasks: ../../../roles/splunk_docker/tasks/plan_token_reconciliation.yml

    - name: Select old-audience tokens for post-publication cleanup
      ansible.builtin.include_tasks: ../../../roles/splunk_docker/tasks/plan_token_cleanup.yml

    - name: Save audience-change cleanup result
      ansible.builtin.set_fact:
        audience_change_matching_ids: "{{ splunk_docker_matching_tokens | map(attribute='name') | list }}"
        audience_change_eligible_ids: "{{ splunk_docker_eligible_tokens | map(attribute='name') | list }}"
        audience_change_cleanup_ids: "{{ splunk_docker_noncanonical_eligible_tokens | map(attribute='name') | list }}"

- name: Assert only the old declared-audience token is in cleanup
  ansible.builtin.assert:
    that:
      - audience_change_matching_ids == ['old-mcp-token', 'platform-minted-id']
      - audience_change_eligible_ids == ['old-mcp-token', 'platform-minted-id']
      - audience_change_cleanup_ids == ['old-mcp-token']

- name: Load a native-to-native audience change with a lone old-audience token
  ansible.builtin.set_fact:
    splunk_docker_user_token_audience: platform-search
    splunk_docker_bao_published_token: published-old-audience-token
    splunk_docker_token_probe_ok: true
    splunk_docker_eligible_tokens:
      - name: old-native-token
        content:
          status: enabled
          claims: {sub: svc-platform-search, aud: platform-search-old, nbr: 0, exp: 0}

- name: Evaluate the lone old-audience token
  ansible.builtin.include_tasks: ../../../roles/splunk_docker/tasks/evaluate_canonical_token.yml

- name: Assert a lone old-audience token is not canonical
  ansible.builtin.assert:
    that:
      - not (splunk_docker_bao_token_valid | bool)

- name: Load the same token on the declared audience
  ansible.builtin.set_fact:
    splunk_docker_eligible_tokens:
      - name: current-native-token
        content:
          status: enabled
          claims: {sub: svc-platform-search, aud: platform-search, nbr: 0, exp: 0}

- name: Evaluate the declared-audience token
  ansible.builtin.include_tasks: ../../../roles/splunk_docker/tasks/evaluate_canonical_token.yml

- name: Assert a lone declared-audience token is canonical
  ansible.builtin.assert:
    that:
      - splunk_docker_bao_token_valid | bool
