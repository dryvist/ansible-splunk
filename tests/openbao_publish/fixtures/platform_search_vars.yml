---
# Native authorization-token mint scenario, paired with fixtures/base_vars.yml's MCP scenario.
splunk_docker_mgmt_port: 8089
splunk_docker_user_token_audience: platform-search
splunk_docker_user_token_probe: search
splunk_docker_token_expires_on: "+47d"
splunk_user:
  name: svc-platform-search
splunk_docker_new_token_id: platform-minted-id
splunk_docker_token_list:
  json:
    entry:
      - name: old-mcp-token
        content:
          status: enabled
          claims: {sub: svc-platform-search, aud: mcp, nbr: 0, exp: 0}
      - name: platform-minted-id
        content:
          status: enabled
          claims: {sub: svc-platform-search, aud: platform-search, nbr: 0, exp: 0}
