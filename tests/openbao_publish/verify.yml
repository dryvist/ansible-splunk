---
# Verify the Splunk MCP publication contract.
#
# This suite previously built a synthetic three-segment JWT and asserted the
# role could decode it. It passed continuously while the role failed on every
# real converge, because /services/mcp_token does not issue a JWT - it issues
# an opaque two-segment token. The fixture invented a shape the server never
# produces, so the test proved only that the role agreed with the fixture.
#
# The fixtures below now match what Splunk actually returns: opaque tokens, and
# identity read from the token LISTING (which is where sub/aud/exp/nbr really
# live). Liveness is a probe result, injected as a fact here so these stay
# offline unit tests.
- name: Verify the canonical Splunk MCP publication contract
  hosts: localhost
  gather_facts: false
  # Fixture data (the token-listing scenarios) lives in fixtures/base_vars.yml —
  # pure data, split out so this file stays the test flow, not the fixtures.
  vars_files:
    - fixtures/base_vars.yml

  # Split across tasks/ (one file per phase: evaluate+deliver scenarios, minted
  # identity, cleanup+final inventory, soft-deleted recovery, workflow-structure
  # extraction, the final assert) rather than one flat tasks: list — an agent
  # debugging one scenario should not have to read every other scenario to find
  # it. Every include below stays in a single play, so set_fact state threads
  # through exactly as it did when these were inline.
  tasks:
    - name: Load splunk_docker role defaults
      ansible.builtin.include_vars:
        dir: ../../roles/splunk_docker/defaults/main

    - name: Exercise token reconciliation, evaluation, and delivery planning
      ansible.builtin.include_tasks: tasks/01-evaluate-and-deliver.yml

    - name: Exercise minted-identity recording and verification
      ansible.builtin.include_tasks: tasks/02-minted-identity.yml

    - name: Exercise post-publication cleanup and final inventory planning
      ansible.builtin.include_tasks: tasks/03-cleanup-and-final-inventory.yml

    - name: Exercise soft-deleted OpenBao source recovery
      ansible.builtin.include_tasks: tasks/04-soft-deleted-recovery.yml

    - name: Extract the managed-user workflow task structure
      ansible.builtin.include_tasks: tasks/05-extract-workflow-structure.yml

    - name: Exercise audience-change token cleanup
      ansible.builtin.include_tasks: tasks/07-audience-change-cleanup.yml

    - name: Assert the full publication contract
      ansible.builtin.include_tasks: tasks/06-assert-contract.yml
