---
collections:
  - name: ansible.posix
    version: ">=2.1.0,<3.0.0"
  - name: community.general
    version: ">=13.0.0,<14.0.0"
  - name: community.docker
    version: ">=5.0.6,<6.0.0"
  # RustFS inventory resolver: s3_object
  - name: amazon.aws
    version: ">=9.0.0"
  - name: community.hashi_vault
    version: ">=6.0.0"

  # Shared homelab roles (inventory_resolve). A collection, not a `roles:` git
  # entry: `ansible-galaxy role install` archives the whole repo, then picks
  # what to install by taking the SHORTEST path above any meta/main.yml it
  # finds. The name in the entry selects nothing. A repo holding one role
  # resolves to that role and looks correct; add a second role that sorts
  # shorter and the same pin silently installs that one instead, still under
  # the requested name — at this pin it installed cribl_edge as
  # roles/inventory_resolve. A collection installs from the subdirectory
  # holding galaxy.yml, so every role is addressed unambiguously by FQCN.
  #
  # An immutable SHA, not a branch — a moving ref would let an unreviewed
  # contracts change reach a converge here without a PR in this repo.
  - name: https://github.com/dryvist/homelab-contracts.git#/ansible/
    type: git
    version: 5830aa4121857d748b3903e628e26b91d2d90a81

# splunk.splunk stays a `roles:` entry: its repository root IS the role, which
# is the one shape `role install` addresses correctly. Install both sections
# with `ansible-galaxy install -r requirements.yml` — `collection install` and
# `role install` each silently ignore the other and still exit zero.
roles:
  # Official Splunk Ansible role - use for REST API-based app management
  # and future cluster topology (indexer cluster, SHC) expansion.
  - name: splunk.splunk
    src: https://github.com/splunk/ansible-role-for-splunk
    version: "v2.1.6"
