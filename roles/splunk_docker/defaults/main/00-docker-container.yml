---
# Splunk Docker role defaults
#
# Split across this directory rather than one file: Ansible loads every file
# in defaults/main/ for the role, and a single flat file had grown past the
# point where the section you want could be found by reading.

# Docker configuration
splunk_docker_package_name: docker.io
splunk_docker_compose_package: docker-compose-plugin

# Splunk container configuration
# Splunk image. PINNED AND QUOTED, both deliberately.
#
# Pinned: a floating tag is only ever pulled once. The image is fetched when it
# is absent and never again, so the deployed version freezes at whatever the tag
# resolved to on the day the host was first built while every later converge
# reports changed=0 -- a drift with no signal attached to it.
#
# Quoted: the org Renovate preset finds images with
# `_image:\s*["'](?<depName>...):(?<currentValue>...)["']` -- an UNQUOTED value
# does not match, so an unquoted pin is an untracked pin and never gets a PR.
# The quotes are what turn this line into something Renovate maintains.
splunk_docker_image: "splunk/splunk:10.6.0"
splunk_docker_hostname: splunk
splunk_docker_container_name: splunk

# Splunk credentials - set in playbook vars
splunk_docker_password: ""

# Saved-search alert delivery: the ntfy alert hub, which fans out to Slack and
# Zammad. Required: assert_alerting_gates.yml fails the converge when empty.
#
# Full topic URL, delivered via Splunk's built-in webhook alert action (the URL
# is allowlisted in alert_actions.conf.j2). ntfy is a Traefik ingress route, so
# its name lives under the ingress subdomain (PROXMOX_SUBDOMAIN, the same base
# the traefik role serves), never the apex.
splunk_docker_alert_ntfy_url: >-
  {{ ('https://ntfy.' ~ lookup('env', 'PROXMOX_SUBDOMAIN') ~ '/keystone')
     if lookup('env', 'PROXMOX_SUBDOMAIN') else '' }}

# Splunk General Terms acceptance string for SPLUNK_GENERAL_TERMS env var.
# Override in staging to point at non-prod terms acceptance strings if Splunk
# publishes a new SGT version mid-release cycle.
splunk_docker_sgt_accept: "--accept-sgt-current-at-splunk-com"
