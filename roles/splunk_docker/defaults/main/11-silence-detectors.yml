---
# Per-index pipeline-silence detectors.
#
# A by_host: true entry (os, hardware) still renders its own
# [<name>_silence_detector] saved search (see 07-generic-silence-detectors.j2)
# cloning the macos_edge_silence_detector shape: tstats latest(_time) over the
# index BY HOST, alert when a host's own silence exceeds its cadence-derived
# threshold.
#
# Every other entry feeds ONE shared [index_gap_detector] saved search
# instead of rendering its own stanza: only `index` and
# `threshold_minutes` are read from it, as one branch of that search's
# threshold case(). `cron`, `suppress_minutes`, `sourcetype` and `disabled`
# are BY_HOST-ONLY FIELDS as a result — setting any of them on a non-by_host
# entry has no effect, because index_gap_detector owns its own fixed
# schedule/suppression/enablement across every index it covers. An index
# entry with no matching detector here still gets covered, at the flat
# 1440-minute (24h) default index_gap_detector falls back to.
#
# Fields:
#   name              — stanza prefix for a by_host entry; ignored otherwise.
#                       Must not collide with the bespoke detectors in
#                       savedsearches/*.j2 (macos_edge, llm_pipeline,
#                       llm_manager_panic, llm_router*).
#   index             — index to watch. Read by every entry.
#   threshold_minutes — silence duration that fires the alert. Read by every
#                       entry. For a non-by_host entry this is the only
#                       threshold. For a by_host entry it is the FLOOR: the
#                       effective per-host threshold is max(that floor, the
#                       host's own observed avg_gap_minutes x
#                       cadence_multiplier), so a naturally-quiet host is not
#                       held to the same bar as a chatty one.
#   cron              — BY_HOST ONLY. Schedule (keep period well below the
#                       threshold).
#   suppress_minutes  — BY_HOST ONLY. alert.suppress.period; throttles
#                       re-fires.
#   by_host           — optional, default false. Detect PER-HOST (`by host`
#                       + alert.suppress.fields = host) so a healthy emitter
#                       can't mask a dead one, using each host's own cadence
#                       (see threshold_minutes above). Note: a host that has
#                       never emitted has no baseline and cannot be detected.
#   cadence_multiplier — by_host only, optional, default 4. Multiplies a
#                       host's observed average inter-event gap to get its
#                       effective threshold.
#   host_overrides    — by_host only, optional, default {}. Map of
#                       hostname -> exact threshold_minutes, for a host whose
#                       computed cadence baseline is wrong (commonly: too new
#                       to have a representative average yet).
#   disabled          — BY_HOST ONLY, optional, default 0. Set 1 to ship the
#                       stanza disabled (e.g. index exists but no emitter
#                       yet). A non-by_host entry has no per-index disable —
#                       exclude the index from splunk_docker_indexes instead.
#   sourcetype        — BY_HOST ONLY, optional filter added to the tstats
#                       WHERE clause.
#   exempt            — optional, default false. Read by every entry.
#                       index_gap_detector-only: renders this index's case()
#                       branch with splunk_docker_silence_exempt_threshold_minutes
#                       instead of threshold_minutes, so a structurally empty
#                       or pre-deployment index never fires no matter how
#                       long it has been silent. threshold_minutes is still
#                       required (kept at a nominal value) so this entry's
#                       contribution to gap_lookback_minutes' max() does not
#                       balloon the shared tstats lookback window every index
#                       in the report is queried over.
#   exempt_reason     — required when exempt is true. One sentence: why this
#                       index is expected to stay silent, not broken.
#
# dispatch.earliest_time (the search lookback) is threshold_minutes x this
# multiplier — see the comment above each rendered stanza in
# savedsearches.conf.j2 for why it is derived per-detector rather than one
# flat window shared by a 15-minute and a 24-hour detector alike, and for the
# residual limit (a host silent longer than the window still has no row for
# tstats to return, same as an index with zero events in the whole window).
splunk_docker_silence_lookback_multiplier: 2000

# index_gap_detector's case() threshold for any entry marked exempt: true
# below. One year — long enough that an exempt index never fires regardless
# of how long it has been silent, without feeding that same huge number into
# gap_lookback_minutes' max() (each exempt entry still carries its own
# nominal threshold_minutes for that purpose).
splunk_docker_silence_exempt_threshold_minutes: 525600

# Surfaces shown by the [llm_surface_freshness] report (savedsearches.conf.j2).
# Single definition: the template joins this list into both the roster and the
# tstats WHERE clause, so the two can never drift apart.
#
# This is deliberately NOT derived from splunk_docker_silence_detectors — the
# two lists answer different questions and only partly overlap. Some surfaces
# here have no detector of their own (llm is covered by the bespoke per-host
# llm_pipeline detector, not a generated one), and most detectors above watch
# infrastructure indexes that are not LLM surfaces at all.
splunk_docker_llm_freshness_indexes:
  - otel_traces
  - ai_usage
  - claude
  - codex
  - gemini
  - openai
  - vscode
  - hermes
  - llm
  - openbao_audit

splunk_docker_silence_detectors:
  - name: unifi
    index: unifi
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
    disabled: 0
  # by_host means this only ever alerts on a host it currently SEES in index=os.
  # os_proxmox/os_ai/os_metrics above carve hosts out of the os catch-all at the
  # Cribl source, so a host that migrates to one of those simply stops
  # appearing here — no zero-row trip, no error, just a quieter host list than
  # this detector's own comment implies. os_proxmox and os_ai have no silence
  # detector of their own, so a host is covered by exactly one of "os" here or
  # nothing, never both.
  - name: os
    index: os
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
    by_host: true
    disabled: 0
  # hardware: alert if the hardware index stops receiving telemetry (packs /
  # Cribl / HEC dead). Nothing else watches whether the reclassify is
  # delivering, so while this stayed disabled an index that receives nothing
  # was indistinguishable from an index whose drives are all healthy — and
  # the content alerts below cannot tell you either, because a search over an
  # empty index returns zero results and reports success. This detector is
  # the only thing that closes that gap.
  #
  # ponytail: enabled ahead of the syslog-collector convergence this comment
  # originally gated on (operator decision to lift the cutover gate wholesale,
  # 2026-08-23). If index=hardware is still empty, this will false-fire
  # continuously until the Cribl hardware packs / syslog reclassify converge.
  - name: hardware
    index: hardware
    threshold_minutes: 60
    cron: "*/15 * * * *"
    suppress_minutes: 120
    by_host: true
    disabled: 0
  - name: claude
    index: claude
    threshold_minutes: 60
    cron: "*/15 * * * *"
    suppress_minutes: 240
    disabled: 0
  - name: dns
    index: dns
    threshold_minutes: 30
    cron: "*/10 * * * *"
    suppress_minutes: 120
    disabled: 0
  - name: proxy
    index: proxy
    threshold_minutes: 30
    cron: "*/10 * * * *"
    suppress_minutes: 120
    # ponytail: 7.7M lifetime events but ZERO in the last 7 days as of
    # 2026-08-23 — this will fire immediately on enable. Likely a genuine
    # undetected ingestion outage, not a false alarm.
    disabled: 0
  - name: firewall
    index: firewall
    threshold_minutes: 60
    cron: "*/15 * * * *"
    suppress_minutes: 240
    disabled: 0
  # The gateway emits ZERO IPFIX despite NetFlow showing enabled in its
  # console (a gateway-side export gap — the collector/receive chain is armed
  # and idle; see tofu-unifi live/gateway-telemetry.tf). Structurally-empty
  # index.
  # ponytail: enabled by the 2026-08-23 gate-lift despite the gap above still
  # being open — expect this to fire on every cycle until the gateway starts
  # exporting.
  - name: netflow
    index: netflow
    threshold_minutes: 15
    cron: "*/5 * * * *"
    suppress_minutes: 60
    disabled: 0
  # Low-volume, but a DAY of silence was the wrong bar and hid a real outage.
  # The shipping path stalls in multi-hour bursts and then recovers by itself,
  # so a 1440-minute threshold never fired once across 32 zero-hours in 30
  # days — including a four-hour blackout of the security audit trail on
  # 2026-09-02 that had to be found by hand. The observed floor is ~96
  # records/hour (timer traffic alone), so 90 minutes of true silence is
  # unambiguous and cannot be mistaken for an idle period.
  # Detection is bounded by threshold + cron, so the hourly schedule is kept
  # deliberately: worst case ~2.5h to alert, against ~24h+ before.
  - name: openbao_audit
    index: openbao_audit
    threshold_minutes: 90
    cron: "0 * * * *"
    suppress_minutes: 180
    disabled: 0
  # Voter-health has exactly one implementation: [openbao_raft_quorum] in
  # savedsearches/14-openbao.j2, which reads the real emit location
  # (index=os sourcetype=syslog "openbao-voter-health") and asserts a
  # sustained quorum deficit rather than plain silence. This generic entry
  # used to watch index=openbao/sourcetype=openbao:voter:health, an index
  # that role never created -- a detector that could never fire, and a
  # second voter-health implementation duplicating the one above (Vikunja
  # 2107). Removed rather than repointed: 14-openbao.j2 already covers both
  # "stopped shipping" (samples == 0) and "shipping but degraded" in one
  # search.
  # No honeypot emitter is wired up yet.
  # ponytail: enabled by the 2026-08-23 gate-lift anyway — this index is
  # structurally empty until the deception fabric starts sending, so expect
  # it to fire every cycle until then.
  - name: honeypot
    index: honeypot
    threshold_minutes: 1440
    cron: "0 * * * *"
    suppress_minutes: 1440
    disabled: 0
  # --- LLM fabric surfaces -----------------------------------------------
  # otel_traces: the trace spine. LiteLLM/hermes/orchestration spans AND Claude
  # Code agent-tooling spans both arrive here via the Cribl Stream in_otel
  # listener. That listener held zero events for weeks while every dashboard
  # and config read as healthy, because an empty variable gated it out of the
  # rendered config and nothing watched the result. This detector is the thing
  # that would have noticed.
  #
  # FIRST DETECTOR OFF THE CUTOVER GATE (2026-08-06, since superseded by the
  # 2026-08-23 wholesale gate-lift above). Chosen because this index is the
  # busiest and steadiest surface on the instance — measured over 6h it ran a
  # 1.1-minute worst-case gap against a 30-minute threshold.
  - name: otel_traces
    index: otel_traces
    threshold_minutes: 30
    cron: "*/10 * * * *"
    suppress_minutes: 120
    disabled: 0
  # ai_usage: per-request OTLP log records from the agent CLIs. Sessions are
  # bursty and human-paced, so the threshold is a working day rather than the
  # trace spine's half hour: a day without a single request means the log
  # exporter or the Cribl leg is broken, not that nobody was working.
  - name: ai_usage
    index: ai_usage
    threshold_minutes: 1440
    cron: "17 * * * *"
    suppress_minutes: 720
    disabled: 0
  # hermes: agent card/goal execution. Scheduled cards run hourly, so two
  # hours of silence means the agent tier is not running, not merely idle.
  - name: hermes
    index: hermes
    threshold_minutes: 120
    cron: "*/15 * * * *"
    suppress_minutes: 240
    disabled: 0
  # codex / gemini: interactive CLI sessions. A quiet day is normal operator
  # behaviour, not a fault, so the threshold is deliberately a half-day —
  # long enough that this only fires on a genuinely broken collector.
  - name: codex
    index: codex
    threshold_minutes: 720
    cron: "0 * * * *"
    suppress_minutes: 1440
    disabled: 0
  - name: gemini
    index: gemini
    threshold_minutes: 720
    cron: "0 * * * *"
    suppress_minutes: 1440
    disabled: 0
  # openai (copilot) / vscode: both indexes hold only a handful of lifetime
  # events because their Cribl Edge inputs tail log paths the tools do not
  # actually write.
  # ponytail: enabled by the 2026-08-23 gate-lift ahead of the source-path
  # fix this comment originally gated on — expect both to fire every cycle
  # until the Cribl Edge inputs are repointed at real paths.
  - name: openai
    index: openai
    threshold_minutes: 1440
    cron: "0 */2 * * *"
    suppress_minutes: 1440
    disabled: 0
  - name: vscode
    index: vscode
    threshold_minutes: 1440
    cron: "0 */2 * * *"
    suppress_minutes: 1440
    disabled: 0
  # --- exempt: pre-deployment AI Docker service indexes -------------------
  # index_gap_detector's first live dispatch (2026-09-12) flagged all seven
  # as silent since creation. Each is documented in
  # 09-custom-indexes-core.yml/10-custom-indexes-extra.yml as a
  # "pre-deployment estimate (nothing has shipped yet)" for a container not
  # deployed yet -- expected, not a gap. Re-measure and lower/remove exempt
  # once each container is live and shipping (see the index's own comment
  # in the indexes-core/-extra files for its container name).
  - name: agentgateway
    index: agentgateway
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "pre-deployment AI Docker service, no sender wired yet"
  - name: clickhouse
    index: clickhouse
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "pre-deployment AI Docker service, no sender wired yet"
  - name: dify
    index: dify
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "pre-deployment AI Docker service, no sender wired yet"
  - name: hindsight
    index: hindsight
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "pre-deployment AI Docker service, no sender wired yet"
  - name: langflow
    index: langflow
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "pre-deployment AI Docker service, no sender wired yet"
  - name: langgraph
    index: langgraph
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "pre-deployment AI Docker service, no sender wired yet"
  - name: qdrant
    index: qdrant
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "pre-deployment AI Docker service, no sender wired yet"
  # ai: not part of the seven AI Docker services above -- this is the older,
  # generic index promptfoo model-eval publishes into (see
  # 06-model-eval-regression.j2). That search's own comment already
  # documents index=ai as zero-events-ever and inert until promptfoo
  # actually publishes; this exemption matches that existing call.
  - name: ai
    index: ai
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "inert until the promptfoo model-eval integration publishes"
  # --- exempt: metric/text indexes with no confirmed sender -----------------
  # index_gap_detector's first live dispatch also flagged these six as
  # silent since creation. Unlike the seven above, this repo's own defaults
  # comments describe each as an ALREADY-ACTIVE Telegraf/Cribl pipeline (no
  # "pre-deployment" disclaimer), and no savedsearch anywhere reads from
  # them. Whether the sender is genuinely wired on the Cribl/Telegraf side
  # is unconfirmed from this repo -- exempting here to stop false-positive
  # gap-detector rows, not because the gap is known-expected. Re-measure and
  # lower/remove exempt once ingestion is confirmed one way or the other.
  - name: host_metrics
    index: host_metrics
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "zero events since creation; Telegraf/Cribl sender wiring unconfirmed from this repo"
  - name: llm_metrics
    index: llm_metrics
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "zero events since creation; Cribl sender wiring unconfirmed from this repo"
  - name: netmon_metrics
    index: netmon_metrics
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "zero events since creation; Telegraf/Cribl sender wiring unconfirmed from this repo"
  - name: os_metrics
    index: os_metrics
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "zero events since creation; Cribl sender wiring unconfirmed from this repo"
  - name: unifi_metrics
    index: unifi_metrics
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "zero events since creation; Telegraf/Cribl sender wiring unconfirmed from this repo"
  - name: workstation
    index: workstation
    threshold_minutes: 1440
    exempt: true
    exempt_reason: "zero events since creation; Cribl sender wiring unconfirmed from this repo"
