---
# Indexes to create
splunk_docker_indexes_core:
  # agentgateway: one index per AI Docker service/vendor, not a shared
  # catch-all — each of the 7 below carries genuinely different data from a
  # different product, the same reasoning as one object-storage bucket per
  # workload. Pre-deployment estimate (nothing has shipped yet; re-measure via
  # license_usage.log 30 days after this goes live and adjust): gateway
  # process + 4 lightweight MCP sidecars, ~7 MB/day -> ~2.5 GB/year at the
  # measured ~1.55x on-disk/raw ratio for this kind of textual log.
  - name: agentgateway
    max_size_mb: 4000
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: ai
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # ansible: config-management converge telemetry (one batch of events per
  # converge, emitted by the ansible-proxmox-apps converge_telemetry callback).
  # Very low volume, and the alerts below look back 30 days, so it keeps the
  # shared default size and retention. Its HEC token is derived per index like
  # every other entry here, so no secret has to be provisioned for it.
  - name: ansible
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # claude: highest-volume index on this instance; sized at double the shared
  # default, matching _internal.
  - name: claude
    max_size_mb: 20480
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # clickhouse: one index per AI Docker service/vendor — see the
  # agentgateway entry above for why this is not a shared catch-all.
  # ClickHouse OLAP store (Docker-in-LXC), container stdout/stderr only; the
  # analytical data lives in ClickHouse itself, not Splunk. The per-index
  # HEC routing that derives one output per index already targets this
  # name, so those events have nowhere to land until this index exists.
  # Sized like a server process plus its logs, comparable to langflow/
  # langgraph. Pre-deployment estimate (nothing has shipped yet; re-measure
  # and adjust after 30 days live): ~8 MB/day -> ~4.5 GB/year at the
  # measured ~1.55x on-disk/raw ratio.
  - name: clickhouse
    max_size_mb: 4500
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # codex: Codex CLI agent telemetry — completes the per-agent index family
  # alongside claude/gemini/openai.
  - name: codex
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # dns: resolver query logs shipped via Cribl.
  # dify: one index per AI Docker service/vendor — see the agentgateway entry
  # above for why this is not a shared catch-all. Largest of the seven: 11
  # containers in one stack (api/worker/worker_beat/web + db/redis/weaviate/
  # sandbox/ssrf_proxy/plugin_daemon/nginx sidecars). Pre-deployment estimate
  # (nothing has shipped yet; re-measure and adjust after 30 days live):
  # ~21 MB/day -> ~12 GB/year at the measured ~1.55x on-disk/raw ratio.
  - name: dify
    max_size_mb: 12000
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: dns
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # firewall: ~46% of all ingested data (UniFi FW/IPS split, see `unifi` below).
  # tier: large — only the hot homePath lives on volume:hot_warm; coldPath
  # rolls out to volume:cold. thawedPath stays a literal $SPLUNK_DB path
  # regardless of tier — Splunk rejects a volume: reference there.
  - name: firewall
    tier: large
    home_max_size_mb: 20480
    # SIZE is the control here, not time. This index holds no old data — the
    # volume is simply large — so no realistic frozenTimePeriodInSecs evicts any
    # of it. Capping is what bounds it. An index sitting AT its cap stops
    # consuming new disk: it rolls the oldest bucket to frozen as new data
    # arrives, holding the index flat.
    #
    # 70,000 was an emergency value chosen when hot/warm and cold shared one
    # 200 GB filesystem that had reached 97% full. That constraint is gone: the
    # two tiers now sit on separate dedicated 450 GB volumes, so the cap no
    # longer has to be whatever the filesystem could survive. 102,400 MB
    # (100 GB) leaves real headroom over the ~88 GB currently held, and at the
    # measured ~1.4 GB/day for this index is roughly 72 days of retention.
    #
    # Eviction is archival, not deletion: coldToFrozenScript uploads each bucket
    # before it is removed.
    max_size_mb: 102400
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  - name: gemini
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # hardware: host disk/health telemetry (SMART, IPMI/SEL, NVMe health, ZFS
  # fault events) shipped via Cribl exec packs + a syslog reclassify out of the
  # os catch-all — keeps index=os to OS logs/metrics only. Long retention
  # (365-day default) for drive failure-trend lookback, like the security indexes.
  - name: hardware
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # hermes: Hermes agent operational logs (gateway + watchdog via Cribl syslog
  # route hermes_agent) — dedicated index so agent health is searchable apart
  # from the shared os index.
  - name: hermes
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # hindsight: one index per AI Docker service/vendor — see the agentgateway
  # entry above for why this is not a shared catch-all. Two-replica HA pair,
  # both replicas sharing this index (same product, same data shape). Sized
  # above the shared-default steady state to also cover an elevated container
  # restart rate observed on this service (dockerd's own daemon log shows
  # frequent restarts; the restart banner + traceback each container emits on
  # exit adds real volume on top of steady-state operation). Pre-deployment
  # estimate (nothing has shipped yet; re-measure and adjust after 30 days
  # live): ~17 MB/day combined -> ~10 GB/year at the measured ~1.55x
  # on-disk/raw ratio.
  - name: hindsight
    max_size_mb: 10000
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # honeypot: deception-fabric events (OpenCanary / T-Pot via Cribl). Security
  # index — keep the full 365-day default retention for incident lookback.
  - name: honeypot
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # host_metrics: per-host system metric series (Telegraf/collectors via Cribl)
  # — high-volume, 90-day retention matching netmon_metrics. Metric indexes
  # carry the _metrics suffix by convention (queryable via mstats, NOT events).
  - name: host_metrics
    datatype: metric
    max_size_mb: 25600
    frozen_time_secs: 7776000
  # langflow: one index per AI Docker service/vendor — see the agentgateway
  # entry above for why this is not a shared catch-all. App + its bundled
  # Postgres. Pre-deployment estimate (nothing has shipped yet; re-measure and
  # adjust after 30 days live): ~5 MB/day -> ~2.7 GB/year at the measured
  # ~1.55x on-disk/raw ratio.
  - name: langflow
    max_size_mb: 2750
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # langfuse: one index per AI Docker service/vendor — see the agentgateway
  # entry above for why this is not a shared catch-all. Web + worker +
  # Postgres + ClickHouse + Redis in one stack. Pre-deployment estimate
  # (nothing has shipped yet; re-measure and adjust after 30 days live):
  # ~10 MB/day -> ~6 GB/year at the measured ~1.55x on-disk/raw ratio.
  - name: langfuse
    max_size_mb: 6000
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # langgraph: one index per AI Docker service/vendor — see the agentgateway
  # entry above for why this is not a shared catch-all. API server + chat UI.
  # Pre-deployment estimate (nothing has shipped yet; re-measure and adjust
  # after 30 days live): ~8 MB/day -> ~4.5 GB/year at the measured ~1.55x
  # on-disk/raw ratio.
  - name: langgraph
    max_size_mb: 4500
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
  # llm: local LLM-stack telemetry (model-server manager + worker logs,
  # AI-stack process metrics, AI gateway logs) shipped via Cribl Edge -> Stream.
  - name: llm
    max_size_mb: "{{ splunk_docker_index_default_max_size_mb }}"
    frozen_time_secs: "{{ splunk_docker_index_default_frozen_time_secs }}"
    # Mac Studio LLM-stack metric events ride the llm-family Cribl output;
    # the pipeline stamps index=llm_metrics on them, but they still arrive
    # via the llm HEC token — so that token must also be allowed to write
    # to the llm_metrics index.
    extra_hec_indexes: [llm_metrics]
