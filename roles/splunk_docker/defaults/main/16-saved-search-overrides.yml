---
# Settings applied to saved searches that ship inside other apps, so a stock
# search can be enabled and given delivery without copying its definition.
# Each entry names the app and the search; `settings` is posted as-is to
# servicesNS/nobody/<app>/saved/searches/<name>, and only keys whose live
# value differs are sent. Delivery keys are gated on the channel being
# configured, matching the [default] block in savedsearches.conf.j2.
splunk_docker_saved_search_overrides:
  - app: splunk_monitoring_console
    name: DMC Alert - Expired and Soon To Expire Licenses
    settings: >-
      {{ {'disabled': 0, 'alert.track': 1}
         | combine({'action.slack': 1,
                    'action.slack.param.message': '[$name$] $job.resultCount$ result(s) — $view_link$'}
                   if splunk_docker_alert_slack_webhook else {})
         | combine({'action.webhook': 1,
                    'action.webhook.param.url': splunk_docker_alert_ntfy_url ~ '?title=Splunk+license+expiring&priority=high'}
                   if splunk_docker_alert_ntfy_url else {}) }}
