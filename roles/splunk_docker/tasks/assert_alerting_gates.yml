---
- name: Assert a published Hindsight desired state is Boolean
  ansible.builtin.assert:
    that:
      - _service_state is mapping
      - "'hindsight_enabled' not in _service_state or _service_state.hindsight_enabled is boolean"
    fail_msg: The published Hindsight desired state must be Boolean when present.
  vars:
    _service_state: "{{ (tofu_data | default({})).get('constants', {}).get('service_state', {}) }}"
  tags: [alerting]

# Alerting is deployed unconditionally, and its only delivery is the ntfy hub
# webhook. An empty or non-https URL would render a [default] stanza that
# delivers nowhere while the converge still exits 0, so fail loudly instead.
# Zammad and Slack are reached through the hub, never directly from Splunk.
- name: Assert the ntfy hub delivery URL is configured
  ansible.builtin.assert:
    that:
      - splunk_docker_alert_ntfy_url | default('', true) is match('https://')
    fail_msg: >-
      splunk_docker_alert_ntfy_url is not an https URL. Every fired alert
      would deliver nowhere. Set PROXMOX_SUBDOMAIN in the converge
      environment, or override splunk_docker_alert_ntfy_url.
  tags: [alerting]

# A silence detector that watches an index Splunk never created cannot ever
# fire -- tstats over a nonexistent index returns zero rows forever, which is
# indistinguishable from "silent" and indistinguishable from "the index name
# was mistyped". The two known instances of this (proxy shipped disabled,
# openbao_voter_health watching a dropped index) were only found by manually
# diffing the detector list against the live index list. Make the divergence
# fail the converge instead of waiting for the next manual audit.
- name: Assert every silence detector names an index this role actually creates
  ansible.builtin.assert:
    that:
      - item.index in (splunk_docker_indexes | map(attribute='name') | list)
    fail_msg: >-
      splunk_docker_silence_detectors entry '{{ item.name }}' watches index
      '{{ item.index }}', which is not in splunk_docker_indexes. A detector
      on a nonexistent index returns zero rows forever and can never fire.
      Either add the index to splunk_docker_indexes_extra or fix the typo.
  loop: "{{ splunk_docker_silence_detectors }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [alerting]
