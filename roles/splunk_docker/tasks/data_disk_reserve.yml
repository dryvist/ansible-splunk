---
# Tune the filesystem reserved-block percentage on the Splunk index volume.
#
# WHY: ext4 reserves 5% of a filesystem for the superuser by default. That
# default targets a ROOT filesystem, where the reserve keeps root able to log in
# and limits fragmentation. On a dedicated index volume it only hides capacity:
# splunkd runs as an unprivileged uid (41812), so it can only ever use the
# 'available' figure, not 'free'.
#
# On the 200 GB volume this reserved ~10 GB, which is what pushed Splunk below
# its own 5000 MB minimum free-space guard and made it refuse every search while
# `df` still showed ~16 GB free. The guard reads 'available'; operators read
# 'free'; the two disagreed by exactly the reservation.
#
# Splunk enforces retention itself (volume caps + frozenTimePeriodInSecs), so
# the reserve buys no protection here that Splunk is not already providing.

# The reserve applies to the filesystem holding the index data, which is the
# hot_warm volume. Its mount is resolved once, by longest prefix, in
# resolve_volume_mounts.yml.
- name: Use the filesystem holding the Splunk index data
  ansible.builtin.set_fact:
    splunk_docker_var_mount: "{{ splunk_docker_volume_mounts.hot_warm }}"

# Only ext2/3/4 expose reserved blocks via tune2fs. Anything else (xfs, zfs)
# has no equivalent knob and must be skipped rather than guessed at.
- name: Determine whether the reserve is tunable on this filesystem
  ansible.builtin.set_fact:
    splunk_docker_reserve_tunable: >-
      {{
        splunk_docker_var_mount.device is defined
        and splunk_docker_var_mount.fstype | default('') in ['ext2', 'ext3', 'ext4']
      }}

- name: Warn when the index volume is not a separate tunable filesystem
  ansible.builtin.debug:
    msg: >-
      Skipping reserved-block tuning: {{ splunk_docker_var_dir }} is
      {{ 'not a separate mount' if splunk_docker_var_mount.device is not defined
         else 'fstype ' ~ splunk_docker_var_mount.fstype ~ ', which has no reserved-block setting' }}.
  when: not (splunk_docker_reserve_tunable | bool)

- name: Read the current reserved block count
  ansible.builtin.command:
    cmd: "tune2fs -l {{ splunk_docker_var_mount.device }}"
  register: splunk_docker_tune2fs_state
  changed_when: false
  # Read-only probe: must run under --check too, or the tasks below have no
  # output to parse and the dry run fails instead of reporting the real plan.
  check_mode: false
  when: splunk_docker_reserve_tunable | bool

- name: Compute current and target reserved block counts
  ansible.builtin.set_fact:
    splunk_docker_reserved_now: >-
      {{
        splunk_docker_tune2fs_state.stdout
        | regex_search('Reserved block count:\s+(\d+)', '\1')
        | first | int
      }}
    splunk_docker_blocks_total: >-
      {{
        splunk_docker_tune2fs_state.stdout
        | regex_search('Block count:\s+(\d+)', '\1')
        | first | int
      }}
  when: splunk_docker_reserve_tunable | bool

# tune2fs -m takes a percentage but stores a block count, so compare block
# counts rather than percentages: that is what actually changed on disk, and it
# keeps the task honest about idempotency instead of always reporting changed.
- name: Set the reserved-block percentage on the Splunk index volume
  ansible.builtin.command:
    cmd: >-
      tune2fs -m {{ splunk_docker_data_disk_reserved_percent }}
      {{ splunk_docker_var_mount.device }}
  register: splunk_docker_tune2fs_apply
  changed_when: true
  when:
    - splunk_docker_reserve_tunable | bool
    - (splunk_docker_reserved_now | int)
      != ((splunk_docker_blocks_total | int)
          * (splunk_docker_data_disk_reserved_percent | int) / 100) | round | int

- name: Report reclaimed capacity
  ansible.builtin.debug:
    msg: >-
      Reserved blocks on {{ splunk_docker_var_mount.device }}:
      {{ splunk_docker_reserved_now }} ->
      ~{{ ((splunk_docker_blocks_total | int)
           * (splunk_docker_data_disk_reserved_percent | int) / 100) | round | int }}
      ({{ splunk_docker_data_disk_reserved_percent }}% of
      {{ splunk_docker_blocks_total }} blocks).
  when:
    - splunk_docker_reserve_tunable | bool
    - splunk_docker_tune2fs_apply is changed
