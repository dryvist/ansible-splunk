---
# Create/reconcile ONE Splunk user and (when a delivery path exists) ensure it
# has a live authorization token. Included per-item from manage_users.yml with
# loop_var: splunk_user ({ name, roles: [..] }).

- name: "Look up Splunk user {{ splunk_user.name }}"
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/authentication/users/{{ splunk_user.name }}?output_mode=json"
    method: GET
    user: "{{ splunk_admin_user | default('admin') }}"
    password: "{{ splunk_docker_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  register: splunk_docker_user_lookup
  no_log: true
  # Read-only existence check, and it has to run under --check as well. Skipped,
  # the create task below evaluates an undefined status and the whole dry run
  # dies here — so --check could never reach the tasks after this point, which
  # is most of the role.
  check_mode: false

# Password is a fresh random string used ONLY at creation — the token is the
# credential clients use, so the password is never stored or rotated here.
- name: "Create Splunk user {{ splunk_user.name }}"
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/authentication/users"
    method: POST
    user: "{{ splunk_admin_user | default('admin') }}"
    password: "{{ splunk_docker_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: form-urlencoded
    body:
      name: "{{ splunk_user.name }}"
      password: "{{ lookup('ansible.builtin.password', '/dev/null chars=ascii_letters,digits length=40') }}"
      roles: "{{ splunk_user.roles }}"
    status_code: [200, 201]
  when: splunk_docker_user_lookup.status == 404
  no_log: true

- name: "Reconcile roles for Splunk user {{ splunk_user.name }}"
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/authentication/users/{{ splunk_user.name }}"
    method: POST
    user: "{{ splunk_admin_user | default('admin') }}"
    password: "{{ splunk_docker_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: form-urlencoded
    body:
      roles: "{{ splunk_user.roles }}"
    status_code: [200]
  when: splunk_docker_user_lookup.status == 200
  no_log: true

# A Splunk auth-token JWT is returned exactly once, at creation. Mint only with
# an OpenBao delivery path, validate that canonical credential every converge,
# and never revoke its predecessor until a replacement is durably published.
- name: "Ensure a live token for {{ splunk_user.name }}"
  when: splunk_docker_token_publish_openbao | bool
  block:
    - name: "List existing tokens for {{ splunk_user.name }}"
      ansible.builtin.uri:
        url: >-
          https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/authorization/tokens?output_mode=json&username={{
          splunk_user.name | urlencode }}&count=0
        method: GET
        user: "{{ splunk_admin_user | default('admin') }}"
        password: "{{ splunk_docker_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: splunk_docker_token_list
      # Read-only lookup whose result gates later tasks. Must run under --check
      # too, or the dry run dies on an undefined result before reaching them.
      check_mode: false
      no_log: true

    - name: "Plan token state for {{ splunk_user.name }}"
      ansible.builtin.include_tasks: plan_token_reconciliation.yml

    - name: "Read current OpenBao secret at {{ splunk_docker_token_openbao_path }}"
      ansible.builtin.uri:
        url: "{{ splunk_docker_token_openbao_addr }}/v1/{{ splunk_docker_token_openbao_mount }}/data/{{ splunk_docker_token_openbao_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ splunk_docker_token_openbao_token }}"
        validate_certs: true
        status_code: [200, 404]
      delegate_to: localhost
      register: splunk_docker_bao_current
      # Read-only lookup whose result gates later tasks. Must run under --check
      # too, or the dry run dies on an undefined result before reaching them.
      check_mode: false
      no_log: true

    - name: "Read current OpenBao metadata at {{ splunk_docker_token_openbao_path }}"
      ansible.builtin.uri:
        url: "{{ splunk_docker_token_openbao_addr }}/v1/{{ splunk_docker_token_openbao_mount }}/metadata/{{ splunk_docker_token_openbao_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ splunk_docker_token_openbao_token }}"
        validate_certs: true
        status_code: [200, 404]
      delegate_to: localhost
      register: splunk_docker_bao_metadata
      no_log: true

    - name: "Initialize OpenBao recovery state for {{ splunk_user.name }}"
      ansible.builtin.set_fact:
        splunk_docker_bao_current_version: >-
          {{ (splunk_docker_bao_metadata.json | default({}, true)).get('data', {}).get(
               'current_version',
               (splunk_docker_bao_current.json | default({}, true)).get('data', {}).get('metadata', {}).get('version', 0)
             ) | int }}
        splunk_docker_bao_recovered:
          status: 0
          json: {}
      no_log: true

    - name: "Undelete current OpenBao version at {{ splunk_docker_token_openbao_path }}"
      ansible.builtin.uri:
        url: "{{ splunk_docker_token_openbao_addr }}/v1/{{ splunk_docker_token_openbao_mount }}/undelete/{{ splunk_docker_token_openbao_path }}"
        method: POST
        headers:
          X-Vault-Token: "{{ splunk_docker_token_openbao_token }}"
        body_format: json
        body:
          versions: ["{{ splunk_docker_bao_current_version | int }}"]
        validate_certs: true
        status_code: [200, 204]
      delegate_to: localhost
      when:
        - splunk_docker_bao_current.status | int == 404
        - splunk_docker_bao_current_version | int > 0
      no_log: true

    - name: "Re-read recovered OpenBao version at {{ splunk_docker_token_openbao_path }}"
      ansible.builtin.uri:
        url: >-
          {{ splunk_docker_token_openbao_addr }}/v1/{{ splunk_docker_token_openbao_mount }}/data/{{
          splunk_docker_token_openbao_path }}?version={{ splunk_docker_bao_current_version | int }}
        method: GET
        headers:
          X-Vault-Token: "{{ splunk_docker_token_openbao_token }}"
        validate_certs: true
        status_code: [200]
      delegate_to: localhost
      register: splunk_docker_bao_recovered
      when:
        - splunk_docker_bao_current.status | int == 404
        - splunk_docker_bao_current_version | int > 0
      no_log: true

    - name: "Extract canonical OpenBao state for {{ splunk_user.name }}"
      ansible.builtin.include_tasks: extract_openbao_state.yml

    - name: "Validate canonical OpenBao token for {{ splunk_user.name }}"
      vars:
        splunk_docker_token_to_probe: "{{ splunk_docker_bao_published_token }}"
      ansible.builtin.include_tasks: probe_mcp_token.yml

    - name: "Evaluate canonical OpenBao token for {{ splunk_user.name }}"
      ansible.builtin.include_tasks: evaluate_canonical_token.yml

    - name: "Plan token delivery for {{ splunk_user.name }}"
      ansible.builtin.include_tasks: plan_token_delivery.yml

    - name: "Mint and publish replacement token for {{ splunk_user.name }}"
      when: splunk_docker_token_mint_required
      block:
        - name: "Clear replacement token identity for {{ splunk_user.name }}"
          ansible.builtin.set_fact:
            splunk_docker_new_token_id: ""
          no_log: true

        - name: "Mint authorization token for {{ splunk_user.name }}"
          ansible.builtin.uri:
            url: >-
              https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/mcp_token?username={{ splunk_user.name }}{{
              ('&expires_on=' ~ (splunk_docker_token_expires_on | urlencode)) if (splunk_docker_token_expires_on | length > 0) else '' }}
            method: GET
            user: "{{ splunk_admin_user | default('admin') }}"
            password: "{{ splunk_docker_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200, 201]
          register: splunk_docker_token_mint
          no_log: true

        # Must come BEFORE identity is recorded: the mint response has no id,
        # so the new token is identified by diffing this listing against the
        # one taken before the mint.
        - name: "Re-list tokens after minting for {{ splunk_user.name }}"
          ansible.builtin.uri:
            url: >-
              https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/authorization/tokens?output_mode=json&username={{
              splunk_user.name | urlencode }}&count=0
            method: GET
            user: "{{ splunk_admin_user | default('admin') }}"
            password: "{{ splunk_docker_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200]
          register: splunk_docker_token_list_after_mint
          no_log: true

        - name: "Record minted token identity for {{ splunk_user.name }}"
          ansible.builtin.include_tasks: record_minted_identity.yml

        - name: "Probe minted token for {{ splunk_user.name }}"
          vars:
            splunk_docker_token_to_probe: "{{ splunk_docker_token_mint.json.token }}"
          ansible.builtin.include_tasks: probe_mcp_token.yml

        - name: "Verify minted token identity for {{ splunk_user.name }}"
          ansible.builtin.include_tasks: verify_minted_identity.yml

        # KV v2 writes replace the whole secret. Merge sibling data and use the
        # metadata endpoint's current_version so a soft-deleted latest version
        # is recovered with the correct compare-and-set value.
        - name: "Publish {{ splunk_user.name }} MCP connection to OpenBao"
          ansible.builtin.uri:
            url: "{{ splunk_docker_token_openbao_addr }}/v1/{{ splunk_docker_token_openbao_mount }}/data/{{ splunk_docker_token_openbao_path }}"
            method: POST
            headers:
              X-Vault-Token: "{{ splunk_docker_token_openbao_token }}"
            body_format: json
            body:
              data: >-
                {{ splunk_docker_bao_source_data | combine({
                       splunk_docker_url_openbao_key: splunk_docker_mcp_url,
                       splunk_docker_token_openbao_key: splunk_docker_token_mint.json.token
                     }) }}
              options:
                cas: "{{ splunk_docker_bao_cas_version | int }}"
            validate_certs: true
            status_code: [200, 204]
          delegate_to: localhost
          no_log: true
      rescue:
        # The id goes in the query string. Splunk answers 200 either way, but a
        # request that does not name a real id simply deletes nothing - a
        # revocation that silently no-ops is worse than one that errors.
        - name: "Remove unpublished replacement token for {{ splunk_user.name }}"
          ansible.builtin.uri:
            url: >-
              https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/authorization/tokens/{{
              splunk_user.name | urlencode }}?output_mode=json&id={{ splunk_docker_new_token_id | urlencode }}
            method: DELETE
            user: "{{ splunk_admin_user | default('admin') }}"
            password: "{{ splunk_docker_password }}"
            force_basic_auth: true
            validate_certs: false
            status_code: [200]
          register: splunk_docker_unpublished_token_cleanup
          when: splunk_docker_new_token_id | default('') | length > 0
          failed_when: false
          no_log: true

        - name: "Fail replacement publication for {{ splunk_user.name }}"
          ansible.builtin.fail:
            msg: >-
              Replacement token publication failed. The previous token snapshot
              was not revoked; unpublished replacement cleanup was attempted.

    # Re-enumerate after publication so tokens minted concurrently after the
    # original snapshot are also reconciled. Never revoke the published jti.
    - name: "Re-list eligible tokens after publication for {{ splunk_user.name }}"
      ansible.builtin.uri:
        url: >-
          https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/authorization/tokens?output_mode=json&username={{
          splunk_user.name | urlencode }}&count=0
        method: GET
        user: "{{ splunk_admin_user | default('admin') }}"
        password: "{{ splunk_docker_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: splunk_docker_token_list_after_publication
      when: splunk_docker_token_mint_required
      no_log: true

    - name: "Plan post-publication token reconciliation for {{ splunk_user.name }}"
      vars:
        splunk_docker_token_list: "{{ splunk_docker_token_list_after_publication }}"
      ansible.builtin.include_tasks: plan_token_reconciliation.yml
      when: splunk_docker_token_mint_required

    - name: "Plan noncanonical token cleanup for {{ splunk_user.name }}"
      ansible.builtin.include_tasks: plan_token_cleanup.yml
      when: splunk_docker_token_mint_required

    - name: "Revoke noncanonical eligible tokens for {{ splunk_user.name }} / {{ splunk_docker_token_audience }}"
      ansible.builtin.uri:
        url: >-
          https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/authorization/tokens/{{
          splunk_user.name | urlencode }}?output_mode=json&id={{ item.name | urlencode }}
        method: DELETE
        user: "{{ splunk_admin_user | default('admin') }}"
        password: "{{ splunk_docker_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      loop: "{{ splunk_docker_noncanonical_eligible_tokens }}"
      loop_control:
        label: "{{ item.name }}"
      when: splunk_docker_token_mint_required
      no_log: true

    - name: "Re-list tokens after final reconciliation for {{ splunk_user.name }}"
      ansible.builtin.uri:
        url: >-
          https://127.0.0.1:{{ splunk_docker_mgmt_port }}/services/authorization/tokens?output_mode=json&username={{
          splunk_user.name | urlencode }}&count=0
        method: GET
        user: "{{ splunk_admin_user | default('admin') }}"
        password: "{{ splunk_docker_password }}"
        force_basic_auth: true
        validate_certs: false
        status_code: [200]
      register: splunk_docker_token_list_after_reconciliation
      when: splunk_docker_token_mint_required
      no_log: true

    - name: "Plan final token state for {{ splunk_user.name }}"
      vars:
        splunk_docker_token_list: "{{ splunk_docker_token_list_after_reconciliation }}"
      ansible.builtin.include_tasks: plan_token_reconciliation.yml
      when: splunk_docker_token_mint_required

    - name: "Verify sole eligible token is published for {{ splunk_user.name }}"
      ansible.builtin.assert:
        that:
          - splunk_docker_eligible_tokens | length == 1
          - (splunk_docker_eligible_tokens | first).name == splunk_docker_new_token_id
        fail_msg: Published Splunk token is not the sole eligible token after reconciliation
      when: splunk_docker_token_mint_required
      no_log: true

- name: "Token delivery deferred for {{ splunk_user.name }}"
  ansible.builtin.debug:
    msg: >-
      User '{{ splunk_user.name }}' ensured (roles {{ splunk_user.roles | join(',') }}).
      Token minting is deferred because splunk_docker_token_publish_openbao is off.
      Set it true, with BAO_ADDR/BAO_TOKEN in the environment, to mint + publish
      {{ splunk_docker_url_openbao_key }} and {{ splunk_docker_token_openbao_key }} to
      {{ splunk_docker_token_openbao_mount }}/{{ splunk_docker_token_openbao_path }}.
  when: not (splunk_docker_token_publish_openbao | bool)
