---
# App installation tasks — installs/upgrades every entry in splunk_docker_addons.
#
# Target-side direct pull: the air-gapped Splunk VM downloads each archive straight
# from object storage (or GitHub releases) via `ansible.builtin.unarchive` with
# `remote_src: true`. The Ansible controller never stages archives — object storage
# is the single source of truth.
#
# VERSION-AWARE (no install-once): object-storage-sourced apps are (re)extracted whenever the
# version differs from what's installed, not merely when the dir is absent. The
# desired version comes from `manifest.json` (published by sync-splunkbase.yml,
# app_dir → {version, filename}); the installed version is recorded in a
# `.object_storage_version` marker we write inside each app dir. This is what makes
# "always updated to the latest" actually hold — the old `creates:` guard froze
# every app at its first-installed version forever.
#
# Manual apps (no manifest entry, e.g. Slack/Automox) fall back to install-if-missing.
# VisiCore GitHub entries still use `creates:` (separate air-gap follow-up).

- name: Load Splunk add-on registry
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/addons.yml"
  when: splunk_docker_addons is not defined

- name: Ensure Splunk apps directory exists
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/apps"
    state: directory
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0755'

# --- object-storage-sourced apps: version-aware install/upgrade ---

- name: Build the object-storage-sourced add-on list
  ansible.builtin.set_fact:
    splunk_docker_object_storage_addons: >-
      {{ ((splunk_docker_addons | selectattr('install', 'undefined') | list)
          + (splunk_docker_addons | selectattr('install', 'defined')
             | selectattr('install', 'equalto', true) | list))
         | rejectattr('github_repo', 'defined') | list }}

# Inventory often publishes the object-storage "ip" as a DNS name
# (e.g. s3.example.com). Splunk guests on the SIEM VLAN may not resolve that
# name; rewrite to an A-record IP resolved on the controller before any guest
# HTTP fetch.
- name: Resolve object-storage hostname to a guest-reachable IP
  when:
    - splunk_docker_object_storage_addons | length > 0
    - (splunk_docker_artifact_base_url | urlsplit('hostname') | default('', true)) is match('^[A-Za-z]')
  block:
    - name: Look up object-storage A record on the controller
      ansible.builtin.shell: |
        set -euo pipefail
        host="{{ splunk_docker_artifact_base_url | urlsplit('hostname') }}"
        ip="$(getent hosts "$host" 2>/dev/null | awk '{print $1; exit}' || true)"
        if [ -z "$ip" ]; then
          ip="$(dig +short "$host" A 2>/dev/null | awk 'NF && $1 !~ /\.$/ {print; exit}')"
        fi
        test -n "$ip"
        printf '%s\n' "$ip"
      args:
        executable: /bin/bash
      delegate_to: localhost
      become: false
      register: splunk_docker_artifact_dns
      changed_when: false

    - name: Rewrite artifact base URL to the resolved IP
      ansible.builtin.set_fact:
        splunk_docker_artifact_base_url: >-
          http://{{ splunk_docker_artifact_dns.stdout | trim }}:{{
          splunk_docker_artifact_base_url | urlsplit('port') }}{{
          splunk_docker_artifact_base_url | urlsplit('path') }}

# Gated on a non-empty list so Molecule (which sets splunk_docker_addons: []) never
# templates splunk_docker_artifact_base_url / tofu_data, which it does not provide.
- name: Fetch the object-storage add-on version manifest
  ansible.builtin.uri:
    url: "{{ splunk_docker_artifact_base_url }}/manifest.json"
    method: GET
    return_content: true
    status_code: [200, 403, 404]
  register: splunk_docker_object_storage_manifest_q
  # Read-only lookup whose result gates later tasks. Must run under --check
  # too, or the dry run dies on an undefined result before reaching them.
  check_mode: false
  changed_when: false
  failed_when: false
  when: splunk_docker_object_storage_addons | length > 0

# Empty when the manifest is absent/skipped (no sync has run yet, or no object-storage apps)
# — every object-storage app then falls back to install-if-missing, like the legacy behaviour.
- name: Parse the version manifest (empty when absent/unreadable)
  ansible.builtin.set_fact:
    splunk_docker_object_storage_manifest: >-
      {{ (splunk_docker_object_storage_manifest_q.content | from_json)
         if (splunk_docker_object_storage_manifest_q.status | default(0)) == 200
            and (splunk_docker_object_storage_manifest_q.content | default('') | trim)[:1] == '{'
         else {} }}

- name: Read installed version markers
  ansible.builtin.slurp:
    src: "{{ splunk_docker_etc_dir }}/apps/{{ item.app_dir }}/.object_storage_version"
  register: splunk_docker_object_storage_markers
  loop: "{{ splunk_docker_object_storage_addons }}"
  loop_control:
    label: "{{ item.app_dir }}"
  failed_when: false  # missing marker → not installed (or legacy install)

# Initialise accumulators so they stay defined when the loop is empty (Molecule).
- name: Initialise object-storage install accumulators
  ansible.builtin.set_fact:
    splunk_docker_object_storage_plan: []
    splunk_docker_object_storage_decided: []

# needs_install when:
#   manifest app (desired != ''): installed version differs from desired
#   manual  app (desired == ''):  not yet installed
- name: Compute install/upgrade decisions
  ansible.builtin.set_fact:
    splunk_docker_object_storage_plan: >-
      {{ splunk_docker_object_storage_plan | default([]) + [item.0 | combine({
        'desired_version': ((splunk_docker_object_storage_manifest[item.0.app_dir] | default({})).version | default('')),
        'installed_version': (
          (item.1.content | b64decode | trim) if item.1.content is defined else ''
        ),
      })] }}
  loop: "{{ splunk_docker_object_storage_addons | zip(splunk_docker_object_storage_markers.results) | list }}"
  loop_control:
    label: "{{ item.0.app_dir }}"

# selectattr can't compare two attributes to each other, so the decision is
# computed per-item into a bool flag here.
- name: Mark each app's install need
  ansible.builtin.set_fact:
    splunk_docker_object_storage_decided: >-
      {{ splunk_docker_object_storage_decided | default([]) + [item | combine({
        '_needs_install': (
          (item.desired_version != '' and item.desired_version != item.installed_version)
          or (item.desired_version == '' and item.installed_version == '')
        )
      })] }}
  loop: "{{ splunk_docker_object_storage_plan }}"
  loop_control:
    label: "{{ item.app_dir }}"

- name: Show install/upgrade decisions
  ansible.builtin.debug:
    msg: >-
      {{ item.app_dir }}: desired={{ item.desired_version or '(manual)' }}
      installed={{ item.installed_version or '(none)' }}
      → {{ 'INSTALL' if item._needs_install else 'skip' }}
  loop: "{{ splunk_docker_object_storage_decided }}"
  loop_control:
    label: "{{ item.app_dir }}"

# Clean upgrade: drop the old tree first so files removed upstream don't linger.
# Only when an actual prior version exists (fresh installs have nothing to remove).
- name: Remove the old app directory before upgrade
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/apps/{{ item.app_dir }}"
    state: absent
  loop: "{{ splunk_docker_object_storage_decided | selectattr('_needs_install') | selectattr('installed_version', 'ne', '') | list }}"
  loop_control:
    label: "{{ item.app_dir }}"

# FAIL-SOFT (mirrors the controller-side rescue in sync-splunkbase.yml): a download
# failure here — e.g. broken guest DNS making object storage / GitHub unreachable —
# must NOT hard-fail the play. A hard fail aborts BEFORE the notified "Restart Splunk
# container" handler flushes, so freshly deployed indexes/inputs/savedsearches config
# never loads. We register the per-item results and `ignore_errors` so the converge
# continues and every notified config handler still runs; a warning task below names
# the add-ons that failed. Only these two download tasks are softened — no other task
# type is masked. Failed add-ons keep their previously-installed version (or stay absent).
- name: Install/upgrade Splunk add-ons from object storage
  ansible.builtin.unarchive:
    src: "{{ splunk_docker_artifact_base_url }}/{{ item.filename }}"
    dest: "{{ splunk_docker_etc_dir }}/apps/"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    remote_src: true
  loop: "{{ splunk_docker_object_storage_decided | selectattr('_needs_install') | list }}"
  loop_control:
    label: "{{ item.app_dir }} v{{ item.desired_version | default('manual') }}"
  register: splunk_docker_object_storage_install
  ignore_errors: true  # noqa: ignore-errors  # fail-soft: config handlers must still flush
  notify: Restart Splunk container

# Only mark apps that actually extracted — a failed download must not record a marker,
# or the next run would treat it as up to date and never retry.
- name: Record installed version markers
  ansible.builtin.copy:
    content: "{{ item.desired_version or 'manual' }}\n"
    dest: "{{ splunk_docker_etc_dir }}/apps/{{ item.app_dir }}/.object_storage_version"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  loop: >-
    {{ splunk_docker_object_storage_decided | selectattr('_needs_install')
       | rejectattr('app_dir', 'in', _splunk_docker_os_failed_dirs) | list }}
  loop_control:
    label: "{{ item.app_dir }}"
  vars:
    _splunk_docker_os_failed_dirs: >-
      {{ splunk_docker_object_storage_install.results | default([])
         | selectattr('failed', 'defined') | selectattr('failed')
         | map(attribute='item.app_dir') | list }}

# --- GitHub-release apps (VisiCore) — unchanged; see air-gap follow-up ---

- name: Install Splunk add-ons from GitHub Releases
  ansible.builtin.unarchive:
    src: "https://github.com/{{ item.github_repo }}/releases/latest/download/{{ item.filename }}"
    dest: "{{ splunk_docker_etc_dir }}/apps/"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    remote_src: true
    creates: "{{ splunk_docker_etc_dir }}/apps/{{ item.app_dir }}"
  loop: >-
    {{ ((splunk_docker_addons | selectattr('install', 'undefined') | list)
        + (splunk_docker_addons | selectattr('install', 'defined')
           | selectattr('install', 'equalto', true) | list))
       | selectattr('github_repo', 'defined') | rejectattr('pin_version', 'defined') | list }}
  loop_control:
    label: "{{ item.app_dir }}"
  register: splunk_docker_github_install
  ignore_errors: true  # noqa: ignore-errors  # fail-soft: config handlers must still flush
  notify: Restart Splunk container

# Pinned GitHub-release apps: the marker file names the installed tag, so a changed
# pin installs again. The tree is extracted over the existing one, which keeps the
# app's local/ overrides.
- name: Check the release marker of pinned GitHub-release add-ons
  ansible.builtin.stat:
    path: "{{ splunk_docker_etc_dir }}/apps/{{ item.app_dir }}/.release-{{ item.pin_version }}"
  loop: >-
    {{ ((splunk_docker_addons | selectattr('install', 'undefined') | list)
        + (splunk_docker_addons | selectattr('install', 'defined')
           | selectattr('install', 'equalto', true) | list))
       | selectattr('github_repo', 'defined') | selectattr('pin_version', 'defined') | list }}
  loop_control:
    label: "{{ item.app_dir }} {{ item.pin_version }}"
  register: splunk_docker_github_pinned_marker

- name: Install pinned GitHub-release add-ons
  ansible.builtin.unarchive:
    src: "https://github.com/{{ item.github_repo }}/releases/download/{{ item.pin_version }}/{{ item.filename }}"
    dest: "{{ splunk_docker_etc_dir }}/apps/"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    remote_src: true
  loop: "{{ splunk_docker_github_pinned_marker.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
  loop_control:
    label: "{{ item.app_dir }} {{ item.pin_version }}"
  register: splunk_docker_github_pinned_install
  ignore_errors: true  # noqa: ignore-errors  # fail-soft: config handlers must still flush
  notify: Restart Splunk container

# A failed download must not record a marker, or the next run would never retry.
- name: Record the release marker of pinned GitHub-release add-ons
  ansible.builtin.copy:
    content: ""
    dest: "{{ splunk_docker_etc_dir }}/apps/{{ item.item.app_dir }}/.release-{{ item.item.pin_version }}"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  loop: "{{ splunk_docker_github_pinned_install.results | default([]) | rejectattr('failed') | list }}"
  loop_control:
    label: "{{ item.item.app_dir }} {{ item.item.pin_version }}"

# Surface exactly which add-ons failed (from the registered loop results) and why the
# converge is proceeding anyway, so a broken download is loud but non-fatal.
- name: Warn about add-ons that failed to install (fail-soft)
  ansible.builtin.debug:
    msg: >-
      Add-on install failed for [{{ _splunk_docker_failed_addons | join(', ') }}];
      continuing the converge so config handlers (indexes/inputs/savedsearches +
      Restart Splunk container) still flush. These add-ons keep their previously
      installed version, or remain absent — re-run once object storage / GitHub is
      reachable. Errors: {{ _splunk_docker_failed_details | join(' | ') }}
  vars:
    _splunk_docker_failed_addons: >-
      {{ (splunk_docker_object_storage_install.results | default([])
          | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='item.app_dir') | list)
         + (splunk_docker_github_install.results | default([])
          | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='item.app_dir') | list)
         + (splunk_docker_github_pinned_install.results | default([])
          | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='item.app_dir') | list) }}
    _splunk_docker_failed_details: >-
      {{ (splunk_docker_object_storage_install.results | default([])
          | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='msg') | list)
         + (splunk_docker_github_install.results | default([])
          | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='msg') | list)
         + (splunk_docker_github_pinned_install.results | default([])
          | selectattr('failed', 'defined') | selectattr('failed')
          | map(attribute='msg') | list) }}
  when: _splunk_docker_failed_addons | length > 0

# Splunk container runs as uid 41812; ensure every extracted app/TA is owned
# by that user so the running process can read/write its own config.
- name: Set correct ownership on Splunk apps directory
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/apps"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    recurse: true
  notify: Restart Splunk container
