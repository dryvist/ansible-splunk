---
# Check if Docker is already installed to skip installation tasks
- name: Check if Docker is installed
  ansible.builtin.command: docker --version
  register: splunk_docker_docker_installed
  changed_when: false
  failed_when: false

# Install Docker prerequisites
- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    cache_valid_time: 3600
  when: splunk_docker_docker_installed.rc != 0

- name: Create Docker keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: splunk_docker_docker_installed.rc != 0

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: splunk_docker_docker_installed.rc != 0

- name: Add Docker repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_facts['distribution_release'] }} stable
    state: present
    filename: docker
  when: splunk_docker_docker_installed.rc != 0

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    cache_valid_time: 3600
  when: splunk_docker_docker_installed.rc != 0

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Install Java runtime for DB Connect
  ansible.builtin.include_tasks: java.yml
  when: splunk_docker_java_enabled

# Cosmetic host-side mirror of the in-container splunk UID/GID (41812).
# The container owns bind mounts via UID, not name — this is display-only.
- name: Create splunk group on host (matches container UID/GID)
  ansible.builtin.group:
    name: splunk
    gid: "{{ splunk_docker_group }}"
    system: true
    state: present

- name: Create splunk user on host (matches container UID/GID)
  ansible.builtin.user:
    name: splunk
    uid: "{{ splunk_docker_user }}"
    group: splunk
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    home: "{{ splunk_docker_data_dir }}"
    comment: "Splunk container service account (host-side mirror of UID {{ splunk_docker_user }})"
    state: present

- name: Create Splunk data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0755'
  loop:
    - "{{ splunk_docker_data_dir }}"
    - "{{ splunk_docker_var_dir }}"
    - "{{ splunk_docker_etc_dir }}"
    - "{{ splunk_docker_config_dir }}"
    - "{{ splunk_docker_cold_dir }}"

# Runs after the directories exist so the mount appears in facts, and before the
# container starts so splunkd sees the full usable capacity on its first health
# check rather than a figure the superuser reserve has silently reduced.
- name: Tune reserved blocks on the Splunk index volume
  ansible.builtin.include_tasks: data_disk_reserve.yml
  when: (splunk_docker_data_disk_reserved_percent | int) > 0

- name: Ensure Splunk system/local directory exists
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/system/local"
    state: directory
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0755'

# MUST precede the compose template: it resolves the archive credential into
# splunk_docker_frozen_env, which the compose environment renders. Ordered after
# the directories above because it also drops the freeze script into
# etc/system/local.
- name: Configure the frozen-bucket archive
  ansible.builtin.include_tasks: frozen_archive.yml
  when: splunk_docker_frozen_archive_enabled | bool

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ splunk_docker_config_dir }}/docker-compose.yml"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0600'
  no_log: true
  notify: Restart Splunk container

# Runs before indexes.conf is written so an unbounded cap is caught as a failed
# converge rather than as a disk-full outage weeks later.
- name: Verify Splunk volume caps can actually bound their filesystems
  ansible.builtin.include_tasks: verify_volume_capacity.yml

# An index defined anywhere but the file below is an index nothing here can
# reach. Splunk writes REST/UI-created indexes into the CURRENT app's local
# directory — in practice apps/search/local/indexes.conf — where they inherit
# the stock $SPLUNK_DB paths instead of a volume:, sitting outside volume
# accounting and never rolling under volume pressure. They still land on the
# same physical disk, so every disk-level check passes and the gap is
# invisible.
#
# Removing the file makes the divergence unrepresentable rather than merely
# discouraged: indexes.conf.j2 DERIVES every path, so an index declared
# through splunk_docker_indexes cannot be given a divergent one. Anything that
# needs an index — CI included — declares it there.
#
# No handler on purpose. What this removes is either shadowed (system/local
# already defines the same stanza and wins, so effective config does not
# change) or a disabled stanza Splunk is not serving. Neither needs a restart,
# and the validate check below catches an enabled one that somehow survives.
- name: Remove out-of-band index definitions from app-local scope
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/apps/search/local/indexes.conf"
    state: absent

- name: Deploy indexes.conf
  ansible.builtin.template:
    src: indexes.conf.j2
    dest: "{{ splunk_docker_etc_dir }}/system/local/indexes.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  notify: Restart Splunk container

- name: Deploy inputs.conf for HEC configuration
  ansible.builtin.template:
    src: inputs.conf.j2
    dest: "{{ splunk_docker_etc_dir }}/system/local/inputs.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0600'
  no_log: true
  notify: Restart Splunk container

- name: Deploy limits.conf for HEC memory buffer sizing
  ansible.builtin.template:
    src: limits.conf.j2
    dest: "{{ splunk_docker_etc_dir }}/system/local/limits.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  notify: Restart Splunk container

- name: Deploy web.conf for SSL and update checker configuration
  ansible.builtin.template:
    src: web.conf.j2
    dest: "{{ splunk_docker_etc_dir }}/system/local/web.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  notify: Restart Splunk container

- name: Deploy server.conf for internet access control
  ansible.builtin.template:
    src: server.conf.j2
    dest: "{{ splunk_docker_etc_dir }}/system/local/server.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  notify: Restart Splunk container

# The alerts live in an app, NOT in system/local. Splunk's scheduler dispatches
# saved searches per app context and never walks the system namespace, so a
# scheduled search in etc/system/local/savedsearches.conf is accepted, reports
# enableSched=1, and is never run: next_scheduled_time stays empty forever and
# no scheduler row for it is ever logged. The failure is silent in every
# direction, which is what makes the path a contract rather than a detail --
# tests/templates/test_alerts_app_namespace.py guards it. Alert ACTIONS
# (alert_actions.conf below) are unaffected and stay in system/local; only
# saved searches need the app context.
# The `alerting` tag scopes a converge to the alert configuration alone. The
# role previously carried no tags at all, which made `--tags <anything>` run
# zero tasks and exit 0 — indistinguishable from "already converged", and the
# same silent-success shape that hid the original pipeline outage. Deploying
# alert config without also rotating service tokens needs this scope.
- name: Assert alerting is configured for real delivery, on real indexes
  ansible.builtin.include_tasks: assert_alerting_gates.yml
  tags: [alerting]

- name: Create the homelab_alerts app directories
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/apps/homelab_alerts/{{ item }}"
    state: directory
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0755'
  loop: [default, local, metadata]
  tags: [alerting]

- name: Deploy the homelab_alerts app manifest
  ansible.builtin.copy:
    content: |
      # Managed by the splunk_docker Ansible role.
      [install]
      state = enabled
      [package]
      id = homelab_alerts
      [ui]
      is_visible = 0
      label = Homelab Alerts
    dest: "{{ splunk_docker_etc_dir }}/apps/homelab_alerts/default/app.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  notify: Restart Splunk container
  tags: [alerting]

# export = system reproduces the sharing the searches already had in the system
# namespace, so they stay visible (and their Triggered Alerts stay reachable)
# from the Search app rather than being hidden inside an is_visible=0 app.
- name: Deploy the homelab_alerts app metadata
  ansible.builtin.copy:
    content: |
      # Managed by the splunk_docker Ansible role.
      []
      access = read : [ * ], write : [ admin ]
      export = system
    dest: "{{ splunk_docker_etc_dir }}/apps/homelab_alerts/metadata/local.meta"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  notify: Restart Splunk container
  tags: [alerting]

- name: Deploy savedsearches.conf for pipeline-silence alerts
  ansible.builtin.template:
    src: savedsearches.conf.j2
    dest: "{{ splunk_docker_etc_dir }}/apps/homelab_alerts/local/savedsearches.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0644'
  notify: Restart Splunk container
  tags: [alerting]

# Without this the old stanzas survive in the system namespace as a second,
# permanently-dead copy of every alert name, which is exactly the state that
# made the defect hard to see in the first place.
- name: Remove the never-dispatched system-namespace savedsearches.conf
  ansible.builtin.file:
    path: "{{ splunk_docker_etc_dir }}/system/local/savedsearches.conf"
    state: absent
  notify: Restart Splunk container
  tags: [alerting]

# 0600 + diff:false, not 0644: carries the Slack webhook URL (a credential),
# so neither the file on disk nor the converge diff may expose it.
- name: Deploy alert_actions.conf for ntfy webhook allowlist + Slack delivery
  ansible.builtin.template:
    src: alert_actions.conf.j2
    dest: "{{ splunk_docker_etc_dir }}/system/local/alert_actions.conf"
    owner: "{{ splunk_docker_user }}"
    group: "{{ splunk_docker_group }}"
    mode: '0600'
  diff: false
  notify: Restart Splunk container
  tags: [alerting]

# No absence guard. The previous "pull only when no image by this name is
# present" condition meant a version bump was never fetched: the name matched
# the image already on disk, the pull was skipped, and the converge went green
# on the old build. state: present is already idempotent against a pinned tag --
# it pulls that exact tag when missing and does nothing when it is there.
- name: Pull Splunk Docker image
  community.docker.docker_image:
    name: "{{ splunk_docker_image }}"
    source: pull
    state: present

- name: Start Splunk container with docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ splunk_docker_config_dir }}"
    state: present
  register: splunk_docker_compose_result
  changed_when: >-
    (splunk_docker_compose_result.actions | default([]))
    | selectattr('status', 'in', ['Creating', 'Recreating', 'Pulling', 'Building'])
    | list | length > 0

# Self-heal the admin-password drift trap (stale persisted passwd vs rotated
# SPLUNK_PASSWORD) BEFORE the readiness wait — otherwise a 401 restart-loop
# would just time the wait out. No-op when the password is already in sync.
- name: Reconcile admin password with SPLUNK_PASSWORD
  ansible.builtin.include_tasks: reconcile_admin_password.yml
  when: splunk_docker_wait_enabled

- name: Wait for Splunk to be ready
  ansible.builtin.include_tasks: wait_for_splunk.yml

- name: Deploy firewall rules
  ansible.builtin.template:
    src: firewall.sh.j2
    dest: "{{ splunk_docker_config_dir }}/firewall.sh"
    owner: root
    group: root
    mode: '0755'
  when: splunk_docker_firewall_enabled
  notify: Apply firewall rules

# Install Splunkbase apps and custom add-ons
- name: Install apps and add-ons
  ansible.builtin.include_tasks: apps.yml

# Configure MCP Server post-install (server settings, not token auth)
- name: Configure MCP Server
  ansible.builtin.include_tasks: mcp_server.yml

# Create dedicated service users (e.g. the Hermes AI agent) + mint their auth
# tokens. Runs after the REST API is live (wait_for_splunk, above).
- name: Manage Splunk service users and tokens
  ansible.builtin.include_tasks: manage_users.yml

# Configure DB Connect post-install (Java path for Task/Query servers)
- name: Configure DB Connect
  ansible.builtin.include_tasks: dbconnect.yml
