---
- name: Check whether TA-Nvidia is installed
  ansible.builtin.stat:
    path: "{{ splunk_docker_etc_dir }}/apps/TA-Nvidia"
  register: splunk_docker_ta_nvidia_app

- name: Configure TA-Nvidia input indexes
  when: splunk_docker_ta_nvidia_app.stat.exists
  block:
    - name: Ensure TA-Nvidia local configuration directory exists
      ansible.builtin.file:
        path: "{{ splunk_docker_etc_dir }}/apps/TA-Nvidia/local"
        state: directory
        owner: "{{ splunk_docker_user }}"
        group: "{{ splunk_docker_group }}"
        mode: '0750'

    - name: Deploy TA-Nvidia input overrides
      ansible.builtin.template:
        src: ta_nvidia_inputs.conf.j2
        dest: "{{ splunk_docker_etc_dir }}/apps/TA-Nvidia/local/inputs.conf"
        owner: "{{ splunk_docker_user }}"
        group: "{{ splunk_docker_group }}"
        mode: '0644'
      notify: Restart Splunk container
