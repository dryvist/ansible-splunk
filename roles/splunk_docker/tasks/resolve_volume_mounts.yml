---
# Resolves the filesystem behind each Splunk volume into splunk_docker_volume_mounts,
# keyed hot_warm and cold. Included once from main.yml, so the reserved-block tuning
# and the capacity preflight both read the same resolution.

# hot_warm is volume:hot_warm at $SPLUNK_DB (indexes.conf.j2). The container sees
# it at /opt/splunk/var/lib/splunk, so on the host it is var_dir/lib/splunk.
- name: Resolve the host data path of each Splunk volume
  ansible.builtin.set_fact:
    splunk_docker_volume_data_paths:
      hot_warm: "{{ splunk_docker_var_dir }}/lib/splunk"
      cold: "{{ splunk_docker_cold_dir }}"

# Longest-prefix match on the mount table: a mount covers a path only when its
# mount point is the path itself or one of its ancestors, and the deepest covering
# mount wins. A nested disk therefore beats the parent it sits under. Each volume
# gets its own fact, because a set_fact loop cannot accumulate into one dict.
- name: Resolve the mount point backing each Splunk volume data path
  ansible.builtin.set_fact:
    "splunk_docker_mount_point_{{ item.key }}": >-
      {%- set ns = namespace(best='', best_len=-1) -%}
      {%- for m in ansible_facts.mounts -%}
        {%- if ((item.value ~ '/').startswith(m.mount.rstrip('/') ~ '/'))
              and ((m.mount | length) > ns.best_len) -%}
          {%- set ns.best = m.mount -%}
          {%- set ns.best_len = m.mount | length -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.best }}
  loop: "{{ splunk_docker_volume_data_paths | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Select the mount facts backing each Splunk volume
  ansible.builtin.set_fact:
    splunk_docker_volume_mounts: >-
      {{ {
           'hot_warm': ansible_facts.mounts
             | selectattr('mount', 'equalto', splunk_docker_mount_point_hot_warm)
             | first | default({}),
           'cold': ansible_facts.mounts
             | selectattr('mount', 'equalto', splunk_docker_mount_point_cold)
             | first | default({})
         } }}
