---
# Include every audience for the managed owner except audiences deliberately
# held for another consumer. If the declared audience changes, its old token
# remains a cleanup candidate until replacement publish.
- name: "Snapshot tokens owned by {{ splunk_user.name }}"
  ansible.builtin.set_fact:
    splunk_docker_matching_tokens: >-
      {%- set owner_tokens = (splunk_docker_token_list.json.entry | default([]))
                             | selectattr('name', 'defined')
                             | selectattr('content.claims', 'defined')
                             | selectattr('content.claims.sub', 'defined')
                             | selectattr('content.claims.sub', 'equalto', splunk_user.name)
                             | list -%}
      {%- set extra_audiences = splunk_user.token_extra_audiences | default([]) -%}
      {%- set matching = [] -%}
      {%- for token in owner_tokens -%}
      {%-   if (token.content.claims.aud | default('')) not in extra_audiences -%}
      {%-     set _ = matching.append(token) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{ matching }}
  no_log: true

- name: "Select eligible live tokens for {{ splunk_user.name }}"
  ansible.builtin.set_fact:
    splunk_docker_eligible_tokens: >-
      {%- set eligible = [] -%}
      {# Live-rendered, not the ansible_date_time fact -- that fact is
         gathered once near play start and is stale by the time this task
         runs deep in a long converge. A token minted moments ago carries an
         nbr stamped with the SERVER's real mint time, which is already past
         the stale snapshot, so it fails "not yet valid" and gets excluded
         from its own eligible list. now() evaluates at render time. #}
      {%- set current_epoch = now(utc=true, fmt='%s') | int -%}
      {%- for token in splunk_docker_matching_tokens -%}
        {%- set status = token.content.status | default('') -%}
        {%- set expires_text = token.content.claims.exp | default('') | string -%}
        {%- set not_before_text = token.content.claims.nbr | default('') | string -%}
        {%- if status == 'enabled'
               and expires_text is match('^[0-9]+$')
               and not_before_text is match('^[0-9]+$')
               and (expires_text | int == 0 or expires_text | int > current_epoch)
               and not_before_text | int <= current_epoch -%}
          {%- set _ = eligible.append(token) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ eligible }}
  no_log: true
