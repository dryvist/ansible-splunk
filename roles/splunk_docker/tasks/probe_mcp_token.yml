---
# Prove a token works by using the endpoint selected for its user.
#
# The obvious probe - GET /services/authentication/current-context - does not
# work for MCP tokens. Splunk enforces the `aud` claim, and a token minted by
# /services/mcp_token carries aud=mcp, so ordinary REST paths answer 401 for it.
# MCP and search tokens can be verified through their respective APIs.
#
# MCP tokens use JSON-RPC `initialize`; search tokens run a read-only one-row
# search through the native REST search endpoint. Each user may select the
# probe with `token_probe`; the default follows that user's token audience.
# Sets splunk_docker_token_probe_ok.

- name: "Resolve token probe for {{ splunk_user.name }}"
  ansible.builtin.set_fact:
    splunk_docker_user_token_probe: >-
      {{ splunk_user.token_probe
         | default('mcp' if splunk_docker_user_token_audience == 'mcp' else 'search') }}

- name: "Validate token probe for {{ splunk_user.name }}"
  ansible.builtin.assert:
    that:
      - splunk_docker_user_token_probe in ['mcp', 'search']
    fail_msg: >-
      token_probe for user '{{ splunk_user.name }}' must be one of 'mcp' or
      'search'; got '{{ splunk_docker_user_token_probe }}'.

- name: "Reset token probe state for {{ splunk_user.name }}"
  ansible.builtin.set_fact:
    splunk_docker_token_probe_ok: false
  no_log: true

- name: "Probe the {{ splunk_docker_user_token_probe }} endpoint for {{ splunk_user.name }}"
  ansible.builtin.uri:
    url: >-
      {{ ('https://127.0.0.1:' ~ splunk_docker_mgmt_port ~ '/services/mcp')
         if splunk_docker_user_token_probe == 'mcp'
         else 'https://127.0.0.1:' ~ splunk_docker_mgmt_port ~ '/services/search/v2/jobs/export?output_mode=json' }}
    method: POST
    headers:
      Authorization: "Bearer {{ splunk_docker_token_to_probe }}"
      Accept: "application/json, text/event-stream"
    body_format: "{{ 'json' if splunk_docker_user_token_probe == 'mcp' else 'form-urlencoded' }}"
    body: >-
      {{ {'jsonrpc': '2.0',
          'id': 1,
          'method': 'initialize',
          'params': {'protocolVersion': '2024-11-05',
                     'capabilities': {},
                     'clientInfo': {'name': 'ansible-splunk', 'version': '1'}}}
         if splunk_docker_user_token_probe == 'mcp'
         else {'search': '| makeresults count=1'} }}
    validate_certs: false
    status_code: [200, 201, 400, 401, 403, 404, 405]
    return_content: true
  register: splunk_docker_token_probe
  when: splunk_docker_token_to_probe | default('', true) | length > 0
  # Read-only liveness check whose result gates minting. It must run under
  # --check too, or the dry run evaluates an undefined result.
  check_mode: false
  no_log: true

- name: Record token probe outcome
  ansible.builtin.include_tasks: record_token_probe_outcome.yml
