---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^\.github/(aw/|workflows/(.*\.lock\.yml|agentics-maintenance\.yml))
      - id: end-of-file-fixer
        exclude: ^\.github/(aw/|workflows/(.*\.lock\.yml|agentics-maintenance\.yml))
      - id: check-yaml
        args: [--unsafe]
        exclude: ^\.github/(aw/|workflows/(.*\.lock\.yml|agentics-maintenance\.yml))
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]
        exclude: ^\.github/(aw/|workflows/(.*\.lock\.yml|agentics-maintenance\.yml))

  - repo: local
    hooks:
      - id: ansible-lint
        name: ansible-lint
        # `env -u GIT_DIR ...` is required, not cosmetic. Git exports GIT_DIR,
        # GIT_INDEX_FILE and GIT_WORK_TREE to every hook and children inherit
        # them. ansible-lint auto-installs requirements.yml, and for a
        # git-source entry that means `git clone` then `git checkout <sha>` —
        # which, with GIT_DIR inherited, runs against THIS repo's object store
        # instead of the clone. The pinned commit is genuinely not a ref here,
        # so it fails with "upload-pack: not our ref" naming a SHA that is
        # perfectly valid upstream.
        # Lints only the staged files, one run at a time per machine; CI runs the full-repo lint.
        entry: |-
          sh -c '
          mkdir -p "$HOME/.cache" && exec 9>"$HOME/.cache/pre-commit-ansible-lint.lock" || exit 1
          msg="another ansible-lint is running on this machine; retry later"
          if [ -x /usr/bin/lockf ]; then
            /usr/bin/lockf -s -t 900 9 || { echo "$msg"; exit 1; }
          elif command -v flock >/dev/null 2>&1; then
            flock -w 900 9 || { echo "$msg"; exit 1; }
          else
            echo "ansible-lint: no lockf/flock found; running without the machine-wide lock" >&2
          fi
          exec env -u GIT_DIR -u GIT_INDEX_FILE -u GIT_WORK_TREE ansible-lint "$@"
          ' ansible-lint
        language: system
        files: ^(playbooks|roles|inventory)/.*\.(yaml|yml)$
        pass_filenames: true
        stages: [pre-commit]

      - id: template-tests
        name: template render tests
        # tests/templates/*.py were reachable only by hand: 29 workflows and
        # none run them, and no other hook did either. A suite that never runs
        # is not coverage -- a tree that fails to render could merge green and
        # only break at converge, which is exactly what happened when a macro
        # was deleted while a fragment still imported it.
        # uv --with keeps the deps here rather than requiring a system install;
        # tests/templates/requirements.txt stays the source of truth for CI.
        entry: bash -c 'for t in tests/templates/test_*.py; do uv run -q --with jinja2 --with pyyaml python "$t" || exit 1; done'
        language: system
        files: ^(roles/splunk_docker/(templates|defaults)/|tests/templates/)
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        files: \.md$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
